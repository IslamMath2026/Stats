<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrices</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f4;--card:#fff;--ink:#1d2b2a;--mute:#66736f;--line:#dbe1dc;--acc:#0f6b5c;--accbg:#e1f1ed;--ok:#1b7f4b;--okbg:#e2f4ea;--bad:#b3341f;--badbg:#fbe9e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191a;--card:#1b2526;--ink:#e8efec;--mute:#93a29d;--line:#2d3b3c;--acc:#4fc3ad;--accbg:#173a35;--ok:#5fd394;--okbg:#17362a;--bad:#ff8a73;--badbg:#3b201b}}
:root[data-theme="dark"]{--bg:#12191a;--card:#1b2526;--ink:#e8efec;--mute:#93a29d;--line:#2d3b3c;--acc:#4fc3ad;--accbg:#173a35;--ok:#5fd394;--okbg:#17362a;--bad:#ff8a73;--badbg:#3b201b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;font-size:17px}
main{max-width:620px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub,.mut{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.prob{font-weight:700;margin:0 0 8px}
.q{font-weight:600;margin:12px 0 6px}
.scroll{overflow-x:auto;margin:8px 0 0}
table{border-collapse:collapse;font-size:15px;font-weight:400}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:center}th{background:var(--accbg)}
input[type=text],input[type=password]{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:6px 0 12px}
label.opt{display:block;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
label.opt input{margin:0 8px 0 0}
label.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
label.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.btn{border:0;background:var(--acc);color:#fff;padding:12px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.err{color:var(--bad);min-height:1.4em}
.reveal{background:var(--accbg);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:16px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.hide{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:1px solid #999;break-inside:avoid}}

.mx{display:inline-table;border-collapse:separate;border-spacing:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:6px;margin:2px 6px;vertical-align:middle}
.mx td{border:0;padding:1px 9px;text-align:center;background:none}
.prob{font-weight:500}
</style></head><body><main>
<div id="login" class="card">
<h1>📐 Matrices</h1><p class="sub">Enter your name and password to start.</p>
<label>Student name</label><input type="text" id="name" autocomplete="name" placeholder="Full name">
<label>Password</label><input type="password" id="pass" placeholder="••••">
<div class="err" id="err"></div><button class="btn" id="go">Start</button></div>

<div id="hw" class="hide">
<div class="card"><h1>Matrices</h1><div class="sub">Student: <b id="who"></b></div>
<div class="sub" style="margin-top:8px">Choose one answer for each question, then submit.</div></div>
<div id="qs"></div><div class="err" id="err2"></div>
<button class="btn noprint" id="submit">Submit</button></div>

<div id="res" class="hide">
<div class="card"><h1>Matrices ✅</h1><div>Student: <b id="rwho"></b></div><div class="mut" id="rdate"></div>
<h2 style="margin:10px 0 0">Score: <span id="score"></span></h2></div>
<div id="rdet"></div>
<div class="card noprint"><button class="btn" id="pdf">Save PDF / Send to teacher</button>
<div class="mut" id="pmsg" style="margin-top:8px">Tap the button, accept the prompt, then choose Files, Mail or WhatsApp to save or send the PDF to your teacher.</div></div></div>
</main>
<script>
// ===== Teacher settings =====
var ACCESS_CODE="2026";
// ============================
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=v=>String(v).replace("-","\u2212");
const mx=r=>'<table class="mx">'+r.map(x=>"<tr>"+x.map(v=>"<td>"+f(v)+"</td>").join("")+"</tr>").join("")+"</table>";
const key=m=>JSON.stringify(m);
const perm=()=>sh([1,2,3,4,5,6,7,8,9]);
const rnd=(m,n,lo,hi)=>Array.from({length:m},()=>Array.from({length:n},()=>ri(lo,hi)));
const add=(A,B,s=1)=>A.map((r,i)=>r.map((v,j)=>v+s*B[i][j]));
const scl=(k,A)=>A.map(r=>r.map(v=>k*v));
const tr=A=>A[0].map((_,j)=>A.map(r=>r[j]));
function dm(correct,cands){const seen=new Set([key(correct)]),out=[];
 for(const c of cands){const k=key(c);if(!seen.has(k)){seen.add(k);out.push(c)}}
 let g=0;while(out.length<3&&g++<300){const m=correct.map(r=>r.slice());m[ri(0,m.length-1)][ri(0,m[0].length-1)]+=pick([-2,-1,1,2]);const k=key(m);if(!seen.has(k)){seen.add(k);out.push(m)}}
 return sh(out).slice(0,3)}
function ds(correct,cands){const seen=new Set([correct]),out=[];for(const c of cands){if(!seen.has(c)){seen.add(c);out.push(c)}}return sh(out).slice(0,3)}
function Q(tag,text,ans,wrong,sol){const opts=sh([ans,...wrong]);return {tag,text,ans,opts,sol}}
const sub=(i,j)=>"a<sub>"+i+j+"</sub>";

const G=[
 function(){let m=pick([2,3,4]),n=pick([2,3,4,5]);while(m===n)n=pick([2,3,4,5]);
  const A=rnd(m,n,0,9);const c=`${m} × ${n}, ${m*n} elements`;
  return Q("Order of a matrix",`State the order and the number of elements of A = ${mx(A)}`,c,
   ds(c,[`${n} × ${m}, ${m*n} elements`,`${m} × ${n}, ${m+n} elements`,`${n} × ${m}, ${m+n} elements`]),
   `A has ${m} rows and ${n} columns, so the order is ${m} × ${n} (rows first). Number of elements = ${m} × ${n} = ${m*n}.`)},
 function(){const p=perm(),A=[p.slice(0,3),p.slice(3,6),p.slice(6,9)];let i=ri(1,3),j=ri(1,3);while(i===j)j=ri(1,3);
  const v=A[i-1][j-1],t=A[j-1][i-1];const others=p.filter(x=>x!==v&&x!==t);
  return Q("Elements",`For A = ${mx(A)} find ${sub(i,j)}.`,String(v),ds(String(v),[String(t),String(others[0]),String(others[1])]),
   `${sub(i,j)} is the element in row ${i} and column ${j}. Row ${i} is ${A[i-1].join(", ")}, and its ${j}${["st","nd","rd"][j-1]} entry is ${v}.`)},
 function(){const t=pick(["I","S","D","Z","R","C","Sq"]);let A,name,why;
  if(t==="I"){A=[[1,0,0],[0,1,0],[0,0,1]];name="Identity matrix";why="It is a scalar matrix whose diagonal entries are all 1."}
  else if(t==="S"){const k=ri(2,9);A=[[k,0,0],[0,k,0],[0,0,k]];name="Scalar matrix";why=`It is diagonal with all diagonal entries equal to ${k}. It is not the identity because the entries are ${k}, not 1.`}
  else if(t==="D"){const d=sh([2,3,4,5,6,7,8,9]).slice(0,3).map((v,i)=>i===1?-v:v);A=[[d[0],0,0],[0,d[1],0],[0,0,d[2]]];name="Diagonal matrix";why="It is square and every non-diagonal entry is 0, but the diagonal entries are not all equal."}
  else if(t==="Z"){const m=pick([2,3]);A=Array.from({length:m},()=>[0,0,0]);name="Zero matrix";why="Every element is 0."}
  else if(t==="R"){A=[rnd(1,ri(3,4),1,9)[0]];name="Row matrix";why="It has only one row (1 × n)."}
  else if(t==="C"){A=rnd(ri(3,4),1,1,9);name="Column matrix";why="It has only one column (m × 1)."}
  else{A=rnd(3,3,1,9);name="Square matrix";why="It has equal numbers of rows and columns, but it is not diagonal."}
  const pool=["Identity matrix","Scalar matrix","Diagonal matrix","Zero matrix","Row matrix","Column matrix","Square matrix","Rectangular matrix"].filter(x=>x!==name);
  return Q("Types of matrices",`What is the most specific name of ${mx(A)} ?`,name,sh(pool).slice(0,3),`${name}: ${why}`)},
 function(){const p=ri(2,4),X=ri(2,6),c=ri(1,4),Y=ri(1,7),r=ri(1,9);
  const ans=`x = ${X}, y = ${Y}`;
  return Q("Equality of matrices",`Find x and y if ${mx([[p+"x",3],[r,"y + "+c]])} = ${mx([[p*X,3],[r,Y+c]])}`,ans,
   ds(ans,[`x = ${p*X}, y = ${Y}`,`x = ${X}, y = ${Y+2*c}`,`x = ${X+1}, y = ${Y-1}`,`x = ${p*X-p}, y = ${Y+c}`]),
   `Equal matrices have equal corresponding elements. ${p}x = ${p*X} → x = ${X}, and y + ${c} = ${Y+c} → y = ${Y}.`)},
 function(){const A=rnd(2,2,1,9),B=rnd(2,2,1,9),S=add(A,B);
  return Q("Addition",`Find A + B, where A = ${mx(A)} and B = ${mx(B)}`,mx(S),dm(S,[add(A,B,-1),add(B,A,-1)]).map(mx),
   `Add corresponding elements (same order, so addition is possible): ${mx(S)}`)},
 function(){let A,B;do{A=rnd(2,2,1,9);B=rnd(2,2,1,9)}while(A.some((r,i)=>r.some((v,j)=>v===B[i][j])));
  const D=add(B,A,-1);
  return Q("Subtraction",`Find B − A, where A = ${mx(A)} and B = ${mx(B)}`,mx(D),dm(D,[add(A,B,-1),add(A,B)]).map(mx),
   `Subtract corresponding elements of A from B (B − A is not the same as A − B): ${mx(D)}`)},
 function(){const k=pick([2,3,4,5,-2,-3]),A=rnd(2,3,-4,9);A[0][0]=ri(1,5);const C=scl(k,A);
  return Q("Scalar multiplication",`Find ${f(k)}A for A = ${mx(A)}`,mx(C),
   dm(C,[[A[0].map(v=>k*v),A[1].slice()],A.map(r=>r.map(v=>v+k)),scl(-1,C),[[k*A[0][0],...A[0].slice(1)],A[1].slice()]]).map(mx),
   `Multiply every element by ${f(k)}; the order stays ${2} × ${3}: ${mx(C)}`)},
 function(){const A=rnd(2,2,1,6),B=rnd(2,2,-3,5),T=scl(2,A),R=add(T,B,-1);
  return Q("Combined operations",`Find 2A − B, where A = ${mx(A)} and B = ${mx(B)}`,mx(R),
   dm(R,[add(T,B),add(T,scl(2,B),-1),add(A,scl(2,B),-1),scl(-1,R)]).map(mx),
   `First 2A = ${mx(T)}. Then subtract B element by element: 2A − B = ${mx(R)}`)},
 function(){const [m,n]=pick([[2,3],[3,2]]),p=perm(),A=[];for(let i=0;i<m;i++)A.push(p.slice(i*n,i*n+n));const T=tr(A);
  const lab=(M,a,b)=>mx(M)+` of order ${a} × ${b}`;const ans=lab(T,n,m);
  return Q("Transpose",`Find A<sup>T</sup> and its order, for A = ${mx(A)}`,ans,
   ds(ans,[lab(A,m,n),lab(T,m,n),lab(scl(-1,T),n,m),lab(T.slice().reverse(),n,m)]),
   `Interchange rows and columns: the 1st row of A becomes the 1st column of A<sup>T</sup>, and so on. A is ${m} × ${n}, so A<sup>T</sup> is ${n} × ${m}: ${mx(T)}`)},
 function(){const d=ri(1,9),e=ri(1,9),g=ri(1,9),a=ri(2,8),b=ri(2,8),c=ri(2,8);
  const S=[[d,a,b],[a,e,c],[b,c,g]];const i=ri(0,2);let j=ri(0,2);while(j===i)j=ri(0,2);const v=S[i][j];
  const M=S.map(r=>r.slice());M[Math.min(i,j)][Math.max(i,j)]="x";
  return Q("Symmetric matrix",`For which value of x is ${mx(M)} symmetric?`,`x = ${v}`,ds(`x = ${v}`,[`x = ${-v}`,`x = ${v+2}`,"x = 0"]),
   `A symmetric matrix satisfies ${sub(Math.min(i,j)+1,Math.max(i,j)+1)} = ${sub(Math.max(i,j)+1,Math.min(i,j)+1)}. The mirror element is ${v}, so x = ${v}.`)},
 function(){const a=ri(2,8),b=ri(2,8),c=ri(2,8);
  const M=[[0,a,b],[-a,0,c],["x",-c,0]];
  return Q("Skew-symmetric matrix",`For which value of x is ${mx(M)} skew-symmetric?`,`x = ${-b}`,ds(`x = ${-b}`,[`x = ${b}`,"x = 0",`x = ${b+2}`]),
   `Skew-symmetric means ${sub(3,1)} = −${sub(1,3)}. Since ${sub(1,3)} = ${b}, x = −${b} = ${-b}.`)},
 function(){const t=pick(["sym","skew","none"]);const a=ri(2,8),b=ri(2,8),c=ri(2,8),d=ri(1,9),e=ri(1,9),g=ri(1,9);let M,name,why;
  if(t==="sym"){M=[[d,a,b],[a,e,c],[b,c,g]];name="Symmetric";why="A<sup>T</sup> = A (a<sub>ij</sub> = a<sub>ji</sub>)."}
  else if(t==="skew"){M=[[0,a,b],[-a,0,c],[-b,-c,0]];name="Skew-symmetric";why="A<sup>T</sup> = −A: the diagonal entries are 0 and a<sub>ji</sub> = −a<sub>ij</sub>."}
  else{M=[[d,a,b],[a+1,e,c],[b,c,g]];name="Neither";why="A<sup>T</sup> is not equal to A, and A<sup>T</sup> is not equal to −A (the diagonal is not all 0)."}
  const all=["Symmetric","Skew-symmetric","Both symmetric and skew-symmetric","Neither"];
  return Q("Symmetric / skew-symmetric",`Which statement is true for A = ${mx(M)} ?`,name==="Neither"?"Neither symmetric nor skew-symmetric":name,
   all.filter(x=>x!==name&&!(name==="Neither"&&x==="Neither")).map(x=>x==="Neither"?"Neither symmetric nor skew-symmetric":x).slice(0,3),
   `Find the transpose and compare. ${name==="Neither"?"A is neither symmetric nor skew-symmetric: ":name+": "}${why}`)}
];
let student="",PS=[];
$("go").onclick=()=>{const n=$("name").value.trim(),p=$("pass").value.trim();
 if(!n){$("err").textContent="Please enter your name";return}
 if(p!==ACCESS_CODE){$("err").textContent="Incorrect password";return}
 student=n;$("who").textContent=n;PS=G.map(g=>g());
 $("login").classList.add("hide");$("hw").classList.remove("hide");render()};
function render(){let h="";
 PS.forEach((p,a)=>{h+=`<div class="card"><div class="mut">Question ${a+1} · ${p.tag}</div><div class="prob">${p.text}</div><div class="q">Choose the correct answer:</div>`;
  p.opts.forEach((o,c)=>{h+=`<label class="opt"><input type="radio" name="q${a}" value="${c}">${o}</label>`});h+="</div>"});
 $("qs").innerHTML=h}
$("submit").onclick=()=>{let miss=0;
 PS.forEach((p,a)=>{const c=document.querySelector(`input[name="q${a}"]:checked`);p.pick=c?+c.value:null;if(!c)miss++});
 if(miss){$("err2").textContent=miss+" question(s) not answered";return}
 let sc=0,h="";
 PS.forEach((p,a)=>{const ok=p.opts[p.pick]===p.ans;if(ok)sc++;
  h+=`<div class="card"><div class="mut">Question ${a+1} · ${p.tag}</div><div class="prob">${p.text}</div><div class="q">Choose the correct answer:</div>`;
  p.opts.forEach((o,c)=>{const cls=o===p.ans?"good":(c===p.pick?"bad":"");h+=`<label class="opt ${cls}">${c===p.pick?"● ":"○ "}${o}${o===p.ans?" ✔":""}</label>`});
  h+=`<div class="reveal"><b>Solution:</b><br>${p.sol}</div></div>`});
 $("rdet").innerHTML=h;$("score").textContent=sc+" / "+PS.length;$("rwho").textContent=student;
 $("rdate").textContent=new Date().toLocaleString("en");
 $("hw").classList.add("hide");$("res").classList.remove("hide");window.scrollTo(0,0)};
const LIGHT={"--bg":"#f6f7f4","--card":"#fff","--ink":"#1d2b2a","--mute":"#66736f","--line":"#dbe1dc","--acc":"#0f6b5c","--accbg":"#e1f1ed","--ok":"#1b7f4b","--okbg":"#e2f4ea","--bad":"#b3341f","--badbg":"#fbe9e5"};
$("pdf").onclick=async()=>{
 const btn=$("pdf"),msg=$("pmsg"),fname="Matrices-"+student.replace(/\s+/g,"_")+".pdf";
 btn.disabled=true;btn.textContent="Preparing PDF…";
 try{
  const dl=await (window.claude&&claude.use?claude.use("downloads"):null);
  if(!dl||!window.jspdf||!window.html2canvas){document.title=fname;window.print();return}
  const els=[document.querySelector("#res > .card"),...document.querySelectorAll("#rdet > .card")];
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  const M=15,W=210-2*M,H=297-2*M;let y=M;
  for(const el of els){
   const cv=await html2canvas(el,{scale:2,windowWidth:800,backgroundColor:"#ffffff",onclone:d=>{
     const r=d.documentElement;for(const k in LIGHT)r.style.setProperty(k,LIGHT[k]);
     r.setAttribute("data-theme","light");d.body.style.background="#fff";d.body.style.color="#1d2b2a"}});
   const h=cv.height*W/cv.width;
   if(y+h>297-M&&y>M){pdf.addPage();y=M}
   pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",M,y,W,Math.min(h,H));
   y+=h+4;
  }
  const blob=pdf.output("blob");
  await dl.save({filename:fname,data:blob});
  msg.textContent="Done ✅ You can tap the button again if you need to re-send it.";
 }catch(e){
  msg.textContent=(e&&e.code==="declined")?"Cancelled. Tap the button to try again.":"Could not create the PDF. Try again, or open the link in your browser.";
 }finally{btn.disabled=false;btn.textContent="Save PDF / Send to teacher"}
};
</script></body></html>
