<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add · بدون حمل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ea; --surface:#fffdf7; --ink:#1d3a44; --muted:#5d7580; --line:#c9d8d6; --accent:#ffd84d; --accent-ink:#1d3a44; --ok:#1f7a5a; --okbg:#d9f2e6; --bad:#c0392b; --badbg:#fde3df;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14232a; --surface:#1c3039; --ink:#eef3f1; --muted:#9fb5bc; --line:#34505a; --ok:#6fd3a8; --okbg:#1e4a3a; --bad:#ff8a7a; --badbg:#4a2a26;}
}
:root[data-theme="dark"]{--bg:#14232a; --surface:#1c3039; --ink:#eef3f1; --muted:#9fb5bc; --line:#34505a; --ok:#6fd3a8; --okbg:#1e4a3a; --bad:#ff8a7a; --badbg:#4a2a26;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 2px;text-align:center}
.sub{color:var(--muted);margin:0 0 12px;text-align:center}
details{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px}
summary{font-weight:600;cursor:pointer}
.panel{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:10px}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:3px}
select{width:100%;font:inherit;font-size:16px;padding:7px 9px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;grid-column:1/-1}
.check input{width:20px;height:20px;accent-color:var(--ok)}
.set-note{grid-column:1/-1;color:var(--muted);font-size:.8rem;margin:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px;gap:8px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.q{direction:ltr;margin:6px auto 14px;display:flex;justify-content:center}
.qh{font-size:clamp(1.5rem,7vw,2.1rem);font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.qv{font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;position:relative;padding-left:34px;width:max-content}
.qv .row{line-height:1.3;letter-spacing:.1em}
.qv .plus{position:absolute;left:0;top:1.3em}
.qv .ln{width:100%;border-top:4px solid var(--ink);margin:4px 0 8px}
input.a{font:inherit;font-weight:800;font-size:1.9rem;width:7.5rem;max-width:100%;text-align:center;direction:ltr;border:3px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);padding:4px 6px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.qv input.a{width:100%;min-width:8rem}
input.a:focus{outline:4px solid var(--accent);outline-offset:1px}
input.a.good{border-color:var(--ok);background:var(--okbg)}
input.a.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.msg{min-height:3.2rem;font-weight:600;margin:10px 0}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)}
button{font:inherit;font-weight:800;font-size:1.1rem;padding:11px 26px;border-radius:12px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:4px solid var(--ok);outline-offset:2px}
.big{font-size:3rem;margin:4px 0}
.stars{font-size:2.6rem;letter-spacing:.2em}
.stars .off{opacity:.25;filter:grayscale(1)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.res div{background:var(--bg);border-radius:12px;padding:8px}
.res b{display:block;font-size:1.6rem}
@media (prefers-reduced-motion: reduce){input.a.bad{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1 dir="ltr">Add ➕</h1>
  <p class="sub">الصف الثاني · جمع بدون حمل (مجموع كل منزلة 9 أو أقل)</p>
  <details>
    <summary>إعدادات المعلمة</summary>
    <div class="panel">
      <div><label for="layout">شكل التمرين</label>
        <select id="layout"><option value="both">أفقي وعامودي</option><option value="h">أفقي فقط</option><option value="v">عامودي فقط</option></select></div>
      <div><label for="count">عدد الأسئلة</label>
        <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
      <p class="set-note">تُطبَّق الإعدادات عند بدء لعبة جديدة.</p>
    </div>
  </details>
  <div class="card" id="game"></div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var G=$('game');
  var items=[], idx=0, tries=0, score=0, correct=0, streak=0, best=0, locked=false, timer=null;

  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function make(){
    // كل منزلة: مجموع الرقمين 9 أو أقل، فلا يوجد حمل أبدًا
    var h1=rnd(1,8), h2=rnd(1,9-h1);
    var t1=rnd(0,9), t2=rnd(0,9-t1);
    var o1=rnd(0,9), o2=rnd(0,9-o1);
    return [h1*100+t1*10+o1, h2*100+t2*10+o2];
  }

  function start(){
    clearTimeout(timer);
    var n=parseInt($('count').value,10), layout=$('layout').value;
    items=[];
    for(var i=0;i<n;i++){
      var p=make();
      var v=layout==='v'||(layout==='both'&&i%2===1);
      items.push({a:p[0],b:p[1],v:v});
    }
    idx=0; score=0; correct=0; streak=0; best=0;
    showQ();
  }

  function showStart(){
    G.innerHTML='<div class="big">🧮</div><p class="msg">جاهز تجمع؟ اكتب الجواب واضغط «تحقق».</p><button class="main" id="go">ابدأ اللعب</button>';
    $('go').onclick=start;
  }

  function showQ(){
    var it=items[idx]; tries=0; locked=false;
    var q;
    if(it.v){
      q='<div class="qv"><span class="plus">+</span><div class="row">'+it.a+'</div><div class="row">'+it.b+'</div><div class="ln"></div><input class="a" id="ans" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="الجواب"></div>';
    } else {
      q='<div class="qh"><span>'+it.a+' + '+it.b+' =</span><input class="a" id="ans" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="الجواب"></div>';
    }
    G.innerHTML=
      '<div class="top"><span>السؤال '+(idx+1)+' من '+items.length+'</span><span>⭐ '+score+'</span><span>'+(streak>=2?'🔥 '+streak:'')+'</span></div>'+
      '<div class="bar"><i style="width:'+(idx/items.length*100)+'%"></i></div>'+
      '<div class="q">'+q+'</div>'+
      '<div class="msg" id="msg" aria-live="polite"></div>'+
      '<button class="main" id="chk">تحقق ✓</button>';
    var inp=$('ans');
    inp.oninput=function(){inp.value=inp.value.replace(/[^0-9]/g,'');inp.classList.remove('bad')};
    inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();check()}};
    $('chk').onclick=check;
    inp.focus();
  }

  function setMsg(t,cls){var m=$('msg');m.textContent=t;m.className='msg '+(cls||'')}

  function check(){
    if(locked) return;
    var it=items[idx], inp=$('ans'), v=inp.value;
    if(v===''){inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');setMsg('اكتب جوابك أولاً','bad');return}
    var sum=it.a+it.b;
    if(parseInt(v,10)===sum){
      locked=true;
      var pts=tries===0?10:5;
      score+=pts; correct++; streak++; if(streak>best) best=streak;
      inp.classList.add('good'); inp.readOnly=true;
      var praise=['أحسنت! 🎉','ممتاز! 🌟','برافو عليك! 👏','رائع! 💪'];
      setMsg(praise[rnd(0,praise.length-1)]+' (+'+pts+')','good');
      $('chk').textContent='التالي ←';
      $('chk').onclick=next; $('chk').focus();
      timer=setTimeout(next,1400);
    } else {
      tries++; streak=0;
      inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');
      if(tries===1){
        setMsg('جرّب مرة ثانية. ابدأ بجمع الآحاد: '+(it.a%10)+' + '+(it.b%10),'bad');
        inp.select();
      } else {
        locked=true; inp.readOnly=true;
        setMsg('الجواب الصحيح هو '+sum+'. المرة الجاية بتعرفه!','bad');
        $('chk').textContent='التالي ←';
        $('chk').onclick=next; $('chk').focus();
      }
    }
  }

  function next(){
    clearTimeout(timer);
    if(!locked) return;
    locked=false;
    idx++;
    if(idx>=items.length) showEnd(); else showQ();
  }

  function showEnd(){
    var r=correct/items.length, st=r>=0.9?3:(r>=0.6?2:1), s='';
    for(var i=0;i<3;i++) s+='<span class="'+(i<st?'':'off')+'">⭐</span>';
    var t=r>=0.9?'أنت بطل الجمع! 🏆':(r>=0.6?'شاطر! كمّل تدريب 👍':'محاولة حلوة، جرّب كمان مرة 💪');
    G.innerHTML=
      '<div class="stars" aria-label="'+st+' نجوم">'+s+'</div>'+
      '<p class="msg good" style="font-size:1.3rem">'+t+'</p>'+
      '<div class="res"><div><b>'+correct+' / '+items.length+'</b>إجابات صحيحة</div><div><b>'+score+'</b>نقاط</div></div>'+
      '<div class="res" style="grid-template-columns:1fr"><div><b>🔥 '+best+'</b>أطول سلسلة صح</div></div>'+
      '<button class="main" id="again">العب مرة ثانية</button>';
    $('again').onclick=start;
  }

  showStart();
})();
</script>
</body>
</html>
