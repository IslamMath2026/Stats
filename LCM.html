<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LCM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ea; --surface:#fffdf7; --ink:#1d3a44; --muted:#5d7580; --line:#c9d8d6; --accent:#ffd84d; --accent-ink:#1d3a44; --ok:#1f7a5a; --okbg:#d9f2e6; --bad:#c0392b; --badbg:#fde3df; --chip:#e4eef0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14232a; --surface:#1c3039; --ink:#eef3f1; --muted:#9fb5bc; --line:#34505a; --ok:#6fd3a8; --okbg:#1e4a3a; --bad:#ff8a7a; --badbg:#4a2a26; --chip:#2a4651;}
}
:root[data-theme="dark"]{--bg:#14232a; --surface:#1c3039; --ink:#eef3f1; --muted:#9fb5bc; --line:#34505a; --ok:#6fd3a8; --okbg:#1e4a3a; --bad:#ff8a7a; --badbg:#4a2a26; --chip:#2a4651;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.8rem;font-weight:800;margin:0 0 2px;text-align:center}
.sub{color:var(--muted);margin:0 0 12px;text-align:center}
details{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px}
summary{font-weight:600;cursor:pointer}
.panel{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:10px}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:3px}
select{width:100%;font:inherit;font-size:16px;padding:7px 9px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.set-note{grid-column:1/-1;color:var(--muted);font-size:.8rem;margin:0}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 16px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:8px;gap:8px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.ask{font-weight:600;margin:0 0 10px}
.nums{direction:ltr;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.nums span{background:var(--chip);border:3px solid var(--ink);border-radius:14px;min-width:68px;padding:4px 14px;font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
input.a{font:inherit;font-weight:800;font-size:1.9rem;width:8rem;max-width:100%;text-align:center;direction:ltr;border:3px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);padding:4px 6px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
input.a:focus{outline:4px solid var(--accent);outline-offset:1px}
input.a.good{border-color:var(--ok);background:var(--okbg)}
input.a.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.msg{min-height:3.2rem;font-weight:600;margin:10px 0}
.msg.good{color:var(--ok)} .msg.bad{color:var(--bad)}
.work{direction:ltr;text-align:left;font-size:.95rem;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:10px;padding:6px 10px;margin:0 0 10px}
.work:empty{display:none}
button{font:inherit;font-weight:800;font-size:1.1rem;padding:11px 26px;border-radius:12px;border:3px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:4px solid var(--ok);outline-offset:2px}
.big{font-size:3rem;margin:4px 0}
.stars{font-size:2.6rem;letter-spacing:.2em}
.stars .off{opacity:.25;filter:grayscale(1)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.res div{background:var(--bg);border-radius:12px;padding:8px}
.res b{display:block;font-size:1.6rem}
@media (prefers-reduced-motion: reduce){input.a.bad{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1 dir="ltr">LCM 🧩</h1>
  <p class="sub">الصف الخامس · المضاعف المشترك الأصغر</p>
  <details>
    <summary>إعدادات المعلمة</summary>
    <div class="panel">
      <div><label for="level">المستوى</label>
        <select id="level"><option value="e">سهل (حتى 10)</option><option value="m" selected>متوسط (حتى 20)</option><option value="h">صعب (حتى 30 + ثلاثة أعداد)</option></select></div>
      <div><label for="count">عدد الأسئلة</label>
        <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
      <p class="set-note">تُطبَّق الإعدادات عند بدء لعبة جديدة.</p>
    </div>
  </details>
  <div class="card" id="game"></div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var G=$('game');
  var items=[], idx=0, tries=0, score=0, correct=0, streak=0, best=0, locked=false, timer=null;

  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function gcd(a,b){return b?gcd(b,a%b):a}
  function lcm2(a,b){return a/gcd(a,b)*b}
  function lcmAll(arr){return arr.reduce(function(x,y){return lcm2(x,y)},1)}

  function make(level,i){
    var lo,hi,cap,k=2;
    if(level==='e'){lo=2;hi=10;cap=60}
    else if(level==='m'){lo=4;hi=20;cap=150}
    else {lo=6;hi=30;cap=300; if(i%3===2){k=3;lo=2;hi=12;cap=120}}
    for(var t=0;t<3000;t++){
      var nums=[];
      for(var j=0;j<k;j++) nums.push(rnd(lo,hi));
      var uniq=nums.filter(function(v,p){return nums.indexOf(v)===p});
      if(uniq.length<k) continue;
      var L=lcmAll(nums);
      if(L>cap) continue;
      if(L===Math.max.apply(null,nums)) continue; /* avoid answer = biggest number */
      return {nums:nums,ans:L};
    }
    return {nums:[4,6],ans:12};
  }

  function multiples(n,limit,maxShow){
    var out=[],m=n,c=0;
    while(m<=limit&&c<maxShow){out.push(m);m+=n;c++}
    var s=out.join(', ');
    if(m<=limit) s+=', …';
    return s;
  }
  function working(it){
    return it.nums.map(function(n){return n+': '+multiples(n,it.ans,7)}).join('<br>')+'<br>LCM = '+it.ans;
  }

  function start(){
    clearTimeout(timer);
    var n=parseInt($('count').value,10), level=$('level').value;
    items=[];
    for(var i=0;i<n;i++) items.push(make(level,i));
    idx=0; score=0; correct=0; streak=0; best=0;
    showQ();
  }

  function showStart(){
    G.innerHTML='<div class="big">🧩</div><p class="msg">جاهز؟ لاقي أصغر عدد بنقسم عليه كل الأعداد، واكتب الجواب.</p><button class="main" id="go">ابدأ اللعب</button>';
    $('go').onclick=start;
  }

  function showQ(){
    var it=items[idx]; tries=0; locked=false;
    var chips=it.nums.map(function(n){return '<span>'+n+'</span>'}).join('');
    G.innerHTML=
      '<div class="top"><span>السؤال '+(idx+1)+' من '+items.length+'</span><span>⭐ '+score+'</span><span>'+(streak>=2?'🔥 '+streak:'')+'</span></div>'+
      '<div class="bar"><i style="width:'+(idx/items.length*100)+'%"></i></div>'+
      '<p class="ask">أوجد المضاعف المشترك الأصغر للأعداد:</p>'+
      '<div class="nums">'+chips+'</div>'+
      '<input class="a" id="ans" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="الجواب">'+
      '<div class="msg" id="msg" aria-live="polite"></div>'+
      '<div class="work" id="work"></div>'+
      '<button class="main" id="chk">تحقق ✓</button>';
    var inp=$('ans');
    inp.oninput=function(){inp.value=inp.value.replace(/[^0-9]/g,'');inp.classList.remove('bad')};
    inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();check()}};
    $('chk').onclick=check;
    inp.focus();
  }

  function setMsg(t,cls){var m=$('msg');m.textContent=t;m.className='msg '+(cls||'')}
  function toNext(){$('chk').textContent='التالي ←';$('chk').onclick=next;$('chk').focus()}

  function check(){
    if(locked) return;
    var it=items[idx], inp=$('ans'), v=inp.value;
    if(v===''){inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');setMsg('اكتب جوابك أولاً','bad');return}
    if(parseInt(v,10)===it.ans){
      locked=true;
      var pts=tries===0?10:5;
      score+=pts; correct++; streak++; if(streak>best) best=streak;
      inp.classList.add('good'); inp.readOnly=true;
      var praise=['أحسنت! 🎉','ممتاز! 🌟','برافو عليك! 👏','رائع! 💪'];
      setMsg(praise[rnd(0,praise.length-1)]+' (+'+pts+')','good');
      toNext();
      timer=setTimeout(next,1600);
    } else {
      tries++; streak=0;
      inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');
      var big=Math.max.apply(null,it.nums);
      if(tries===1){
        setMsg('جرّب مرة ثانية. اكتب مضاعفات العدد الأكبر: '+multiples(big,big*4,4)+' … وشوف أول واحد بنقسم على باقي الأعداد.','bad');
        inp.select();
      } else {
        locked=true; inp.readOnly=true;
        setMsg('الجواب الصحيح هو '+it.ans+'. شوف الحل:','bad');
        $('work').innerHTML=working(it);
        toNext();
      }
    }
  }

  function next(){
    clearTimeout(timer);
    if(!locked) return;
    locked=false;
    idx++;
    if(idx>=items.length) showEnd(); else showQ();
  }

  function showEnd(){
    var r=correct/items.length, st=r>=0.9?3:(r>=0.6?2:1), s='';
    for(var i=0;i<3;i++) s+='<span class="'+(i<st?'':'off')+'">⭐</span>';
    var t=r>=0.9?'أنت بطل المضاعفات! 🏆':(r>=0.6?'شاطر! كمّل تدريب 👍':'محاولة حلوة، جرّب كمان مرة 💪');
    G.innerHTML=
      '<div class="stars" aria-label="'+st+' نجوم">'+s+'</div>'+
      '<p class="msg good" style="font-size:1.3rem">'+t+'</p>'+
      '<div class="res"><div><b>'+correct+' / '+items.length+'</b>إجابات صحيحة</div><div><b>'+score+'</b>نقاط</div></div>'+
      '<div class="res" style="grid-template-columns:1fr"><div><b>🔥 '+best+'</b>أطول سلسلة صح</div></div>'+
      '<button class="main" id="again">العب مرة ثانية</button>';
    $('again').onclick=start;
  }

  showStart();
})();
</script>
</body>
</html>
