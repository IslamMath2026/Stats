<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistics Homework</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2b2a;--mute:#66736f;--line:#dbe1dc;--acc:#0f6b5c;--accbg:#e1f1ed;--ok:#1b7f4b;--okbg:#e2f4ea;--bad:#b3341f;--badbg:#fbe9e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191a;--card:#1b2526;--ink:#e8efec;--mute:#93a29d;--line:#2d3b3c;--acc:#4fc3ad;--accbg:#173a35;--ok:#5fd394;--okbg:#17362a;--bad:#ff8a73;--badbg:#3b201b}}
:root[data-theme="dark"]{--bg:#12191a;--card:#1b2526;--ink:#e8efec;--mute:#93a29d;--line:#2d3b3c;--acc:#4fc3ad;--accbg:#173a35;--ok:#5fd394;--okbg:#17362a;--bad:#ff8a73;--badbg:#3b201b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;font-size:17px}
main{max-width:600px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.prob{font-size:17px;font-weight:600}
.scroll{overflow-x:auto;margin:8px 0 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;font-weight:400}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:center}
th{background:var(--accbg)}
.dots{display:flex;gap:6px;margin:0 0 12px}
.dot{height:6px;flex:1;border-radius:3px;background:var(--line)}
.dot.done{background:var(--ok)}.dot.cur{background:var(--acc)}
.q{font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:11px 14px;border-radius:10px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.hint{color:var(--bad);font-size:15px;margin:2px 0 8px}
.reveal{background:var(--accbg);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:16px}
.btn{border:0;background:var(--acc);color:#fff;padding:12px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.final{text-align:center}.final b{font-size:20px}
.score{color:var(--mute);font-size:14px;text-align:center;margin-top:8px}
.tutor{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}.tutor[hidden]{display:none}.trow{display:flex;gap:6px;flex-wrap:wrap}.trow input,.trow select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}.trow input{flex:1;min-width:150px}.tb{border:1.5px solid var(--acc);background:transparent;color:var(--acc);padding:8px 12px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer}.tb:disabled{opacity:.6}.tout{white-space:pre-wrap;margin-top:8px;font-size:16px;background:var(--accbg);border-radius:10px;padding:10px 12px}.tout:empty{display:none}.lvl{color:var(--mute);font-size:14px;margin:0 0 6px}.sel{border-color:var(--acc)!important;background:var(--accbg)!important}.big{font-size:44px;font-weight:700;color:var(--acc)}.tag{color:var(--mute);font-size:14px;margin-bottom:6px}.sol{margin-top:6px}input{border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:var(--card);color:var(--ink);width:100%}#report{position:absolute;left:-10000px;top:0;width:760px;padding:28px;background:#fff;color:#111;--line:#ccc;--ink:#111;--mute:#555;--accbg:#eef6f4;font-family:system-ui,Segoe UI,Arial,sans-serif}#report table{color:#111}#report th{background:#eef6f4}@media print{body>*:not(#report){display:none!important}#report{position:static!important;width:auto!important}}</style>
</head>
<body>
<main>
<h1>Statistics Homework</h1>
<div id="app"></div>
</main>
<div id="report"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sh=a=>[...a].sort(()=>Math.random()-.5);
const f=(x,d=3)=>String(+x.toFixed(d));
const sum=a=>a.reduce((s,v)=>s+v,0);
function numOpts(c,d){const s=new Set([f(c)]);let t=0;while(s.size<4&&t++<120){const v=c+R(1,4)*d*(Math.random()<.5?-1:1);if(c<0||v>=0)s.add(f(v))}return [...s]}
function pick(arr,n){return sh(arr).slice(0,n)}
const gtable=(cl,fr,extra)=>`<div class="scroll"><table><tr><th>Class</th><th>f</th>${extra?extra.h:""}</tr>${cl.map((c,i)=>`<tr><td>${c}</td><td>${fr[i]}</td>${extra?extra.r(i):""}</tr>`).join("")}</table></div>`;

let LV=1;
const GEN={
mean(){const n=LV===1?5:LV===2?R(6,7):R(8,10);let xs=Array.from({length:n},()=>R(2,LV===3?60:20));xs[n-1]+=(n-sum(xs)%n)%n;const s=sum(xs),m=s/n;
return{text:`Find the mean of: ${xs.join(", ")}`,steps:[
{q:"What is the first step in finding the mean?",opts:["Add all the observations (Σx)","Arrange the data in order","Find the most frequent value"],hint:"Mean = Σx ÷ n, so we need Σx first.",reveal:`Σx = ${xs.join(" + ")} = ${s}`},
{q:`Σx = ${s} and n = ${n}. What is the mean?`,opts:numOpts(m,1),hint:`${s} ÷ ${n}`,reveal:`Mean = ${s} ÷ ${n} = ${f(m)}`}]}},
median(){const n=LV===1?[5,7][R(0,1)]:LV===2?R(6,9):[8,10,12][R(0,2)],xs=pick(Array.from({length:30},(_,i)=>i+1),n),so=[...xs].sort((a,b)=>a-b),odd=n%2===1;
const steps=[{q:"What must we do first, before finding the median?",opts:["Arrange the data in ascending order","Add all the values","Find the largest value"],hint:"A common mistake is skipping this step.",reveal:`Arranged: ${so.join(", ")}`}];
if(odd){const k=(n+1)/2;steps.push({q:`n = ${n} is odd. At which position is the median, (n + 1) / 2?`,opts:numOpts(k,1),hint:`(${n} + 1) ÷ 2`,reveal:`Position = (${n} + 1)/2 = ${k}`},{q:`What is the value at position ${k}?`,opts:numOpts(so[k-1],2),hint:`Count to position ${k} in the arranged list.`,reveal:`Median = ${so[k-1]}`})}
else{const a=n/2,m=(so[a-1]+so[a])/2;steps.push({q:`n = ${n} is even. Which two positions do we use? (n/2 and n/2 + 1)`,opts:[`${a} and ${a+1}`,`${a-1} and ${a}`,`${a+1} and ${a+2}`],hint:`n/2 = ${a}`,reveal:`Values at positions ${a} and ${a+1}: ${so[a-1]} and ${so[a]}`},{q:`Take the average of ${so[a-1]} and ${so[a]}. What is the median?`,opts:numOpts(m,1),hint:`(${so[a-1]} + ${so[a]}) ÷ 2`,reveal:`Median = (${so[a-1]} + ${so[a]})/2 = ${f(m)}`})}
steps[0].opts=steps[0].opts;steps.forEach(s=>s.ans=s.ans);
steps[0].ans="Arrange the data in ascending order";
if(odd){steps[1].ans=f((n+1)/2);steps[2].ans=String(so[(n+1)/2-1])}else{const a=n/2;steps[1].ans=`${a} and ${a+1}`;steps[2].ans=f((so[a-1]+so[a])/2)}
return{text:`Find the median of: ${xs.join(", ")}`,steps,preset:1}},
mode(){const v=pick([1,2,3,4,5,6,7,8,9],4),cnt=LV===1?[3,2,1,1]:LV===2?[4,2,2,1]:[4,3,2,1],xs=sh(v.flatMap((x,i)=>Array(cnt[i]).fill(x)));
return{text:`Find the mode of: ${xs.join(", ")}`,steps:[
{q:"How do we find the mode?",opts:["Find the value that occurs most often","Find the middle value","Divide the sum by n"],hint:"Mode = most frequent value.",reveal:`Frequencies: ${[...v].sort((a,b)=>a-b).map(x=>`${x} → ${cnt[v.indexOf(x)]}×`).join(", ")}`},
{q:"Which value is the mode?",opts:v.slice(0,3).map(String),ans:String(v[0]),hint:"Count how many times each value appears.",reveal:`Mode = ${v[0]} (occurs ${cnt[0]} times)`}]}},
range(){const xs=Array.from({length:LV===1?5:LV===2?6:8},()=>LV===3?R(-20,90):R(3,40)),L=Math.max(...xs),S=Math.min(...xs);
return{text:`What is the range of: ${xs.join(", ")}?`,steps:[
{q:"What is the largest value (L)?",opts:pick(xs.filter(x=>x!==L),2).concat(L).map(String),ans:String(L),hint:"Scan the list for the biggest number.",reveal:`L = ${L}`},
{q:"What is the smallest value (S)?",opts:pick(xs.filter(x=>x!==S),2).concat(S).map(String),ans:String(S),hint:"Scan the list for the smallest number.",reveal:`S = ${S}`},
{q:"Range R = L − S. What is R?",opts:numOpts(L-S,2),hint:`${L} − ${S}`,reveal:`R = ${L} − ${S} = ${L-S}`}]}},
grouped(){const nc=LV===1?3:LV===2?4:5,cl=Array.from({length:nc},(_,i)=>`${i*10} – ${(i+1)*10}`),fr=Array.from({length:nc},()=>R(2,LV===3?15:9)),x=Array.from({length:nc},(_,i)=>i*10+5),fx=fr.map((v,i)=>v*x[i]),F=sum(fr),FX=sum(fx),m=FX/F;
const withX=gtable(cl,fr,{h:"<th>x (class mark)</th><th>f·x</th>",r:i=>`<td>${x[i]}</td><td>${fx[i]}</td>`});
return{text:`Find the mean of the grouped data:${gtable(cl,fr)}`,steps:[
{q:"How do we find the class mark (x) of a class?",opts:["(lower limit + upper limit) ÷ 2","upper limit − lower limit","frequency ÷ 2"],hint:"It's the midpoint of the class.",reveal:`Class marks: ${x.join(", ")}`},
{q:`What is Σf (the total frequency)? The frequencies are ${fr.join(", ")}.`,opts:numOpts(F,1),hint:"Add up the frequencies.",reveal:`Σf = ${fr.join(" + ")} = ${F}`},
{q:"Multiply each f by its class mark x, then add. What is Σfx? (Don't add the frequencies instead of multiplying!)",opts:numOpts(FX,10),hint:`${fr.map((v,i)=>`${v}×${x[i]}`).join(" + ")}`,reveal:`${withX}Σfx = ${FX}`},
{q:"Mean = Σfx ÷ Σf. What is the mean?",opts:numOpts(m,1.5),hint:`${FX} ÷ ${F}`,reveal:`Mean = ${FX} ÷ ${F} = ${f(m)}`}]}},
modal(){const w=LV===3?5:10,nc=LV===1?4:LV===2?5:7,cl=Array.from({length:nc},(_,i)=>`${i*w} – ${(i+1)*w}`);let fr;do{fr=Array.from({length:nc},()=>R(2,LV===3?25:14))}while(fr.filter(v=>v===Math.max(...fr)).length>1);const k=fr.indexOf(Math.max(...fr));
return{text:`Find the modal class:${gtable(cl,fr)}`,steps:[
{q:"How do we find the modal class?",opts:["The class with the highest frequency","The class in the middle","The class with the largest limits"],hint:"Mode = most frequent, so look at f.",reveal:`Highest frequency = ${fr[k]}`},
{q:"Which class is the modal class?",opts:pick(cl.filter((_,i)=>i!==k),2).concat(cl[k]),ans:cl[k],hint:`Find the row where f = ${fr[k]}.`,reveal:`Modal class = ${cl[k]}`}]}}
};
function spread(withSD){const n=LV===1?4:LV===2?5:6;let xs=Array.from({length:n},()=>R(2,LV===3?20:14));xs[n-1]+=(n-sum(xs)%n)%n;
const m=sum(xs)/n,sq=xs.map(x=>(x-m)**2),ss=sum(sq),samp=LV===1?false:LV===2?Math.random()<.5:true,dv=samp?n-1:n,v=ss/dv,sd=Math.sqrt(v);
const steps=[
{q:"What is the mean x̄?",opts:numOpts(m,1),hint:`Add the values and divide by ${n}.`,reveal:`x̄ = ${sum(xs)} ÷ ${n} = ${f(m)}`},
{q:"What is Σ(x − x̄)², the sum of squared deviations?",opts:numOpts(ss,2),hint:"For each value: subtract the mean, square it, then add.",reveal:`Squares: ${sq.map(s=>f(s)).join(" + ")} = ${f(ss)}`},
{q:`This is a ${samp?"sample":"population"}. Which divisor do we use?`,opts:[`n = ${n}`,`n − 1 = ${n-1}`,`n + 1 = ${n+1}`],ans:samp?`n − 1 = ${n-1}`:`n = ${n}`,hint:"Population → divide by n. Sample → divide by n − 1.",reveal:`Divide by ${dv}`},
{q:"What is the variance?",opts:numOpts(v,.5),hint:`${f(ss)} ÷ ${dv}`,reveal:`Variance = ${f(ss)} ÷ ${dv} = ${f(v)}`}];
if(withSD)steps.push({q:"What is the standard deviation?",opts:numOpts(sd,.3),hint:"Take the square root of the variance.",reveal:`SD = √${f(v)} = ${f(sd)}`});
return{text:`Find the ${samp?"sample":"population"} ${withSD?"standard deviation":"variance"} of: ${xs.join(", ")}`,steps}}
GEN.variance=()=>spread(false);GEN.sd=()=>spread(true);
GEN.percent=()=>{const cl=["0 – 10","10 – 20","20 – 30","30 – 40"];let fr;do{fr=Array.from({length:4},()=>R(2,LV===3?30:14))}while(LV!==3&&!(LV===1?[20,25]:[20,25,40,50]).includes(sum(fr)));
const k=R(0,3),F=sum(fr),p=fr[k]/F*100;
return{text:`What percentage of the data falls in the class ${cl[k]}?${gtable(cl,fr)}`,steps:[
{q:"Which formula gives the percentage of a class?",opts:["(class frequency ÷ total frequency) × 100","(total frequency ÷ class frequency) × 100","class frequency × total frequency"],hint:"Part ÷ whole, then × 100.",reveal:"Percentage = (f ÷ Σf) × 100"},
{q:"What is the total frequency Σf?",opts:numOpts(F,1),hint:"Add all the frequencies.",reveal:`Σf = ${fr.join(" + ")} = ${F}`},
{q:`The class ${cl[k]} has f = ${fr[k]}. What is its percentage?${LV===3?" (round to 1 decimal place)":""}`,opts:numOpts(p,5).map(v=>f(+v,1)),ans:f(p,1),hint:`${fr[k]} ÷ ${F} × 100`,reveal:`${fr[k]} ÷ ${F} × 100 = ${f(p,1)}%`}]}};
const NAMES={mean:"Mean",median:"Median",mode:"Mode",range:"Range",percent:"Percentage",modal:"Modal class",grouped:"Grouped mean",variance:"Variance",sd:"Standard deviation"};
const TITLE="Statistics Homework 1";
const KEY_WORD="KEY:";
const TASKS=[["mean",1],["median",1],["mode",2],["range",2],["percent",2],["modal",2],["grouped",2],["variance",2],["sd",2],["sd",3]];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hashSeed(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function checksum(id,arr){let h=5381;const s=id+"|"+arr.join(",");for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36).toUpperCase().padStart(6,"0").slice(-6)}
const norm=s=>s.trim().replace(/\s+/g,"").toLowerCase();
function build(idn){const orig=Math.random;Math.random=rng(hashSeed(idn));const qs=[],seen=new Set();
try{for(const [t,lv] of TASKS){LV=lv;let P,tr=0;do{P=GEN[t]();}while(seen.has(P.text)&&tr++<30);seen.add(P.text);
P.steps.forEach(s=>{s.opts=[...new Set(s.opts)];if(s.ans===undefined)s.ans=s.opts[0]});
const last=P.steps[P.steps.length-1];qs.push({t,P,ans:last.ans,opts:sh(last.opts)})}}finally{Math.random=orig}
return qs}
let S={};
function home(msg){document.getElementById("app").innerHTML=`<div class="card"><p class="q">Enter your details to start</p>
<div class="trow" style="flex-direction:column;gap:10px"><input id="nm" placeholder="Full name" autocomplete="name" maxlength="60"><input id="sid" placeholder="University ID" autocomplete="off" maxlength="30"><button class="btn" id="go">Start</button></div>
<div class="hint" id="msg">${msg||""}</div></div><p class="sub">Your questions are generated from your ID, so each student gets different numbers. Entering the same ID again shows the same questions.</p>`;
$("go").onclick=()=>{const name=$("nm").value.trim(),raw=$("sid").value.trim();
if(raw.toUpperCase().startsWith(KEY_WORD)){const id=raw.slice(KEY_WORD.length).trim();if(!id)return home("Enter an ID after "+KEY_WORD);return key(id)}
if(!name||!raw)return home("Please enter your name and ID.");
S={name,id:raw,idn:norm(raw),qs:build(norm(raw)),sel:[],done:false};form()}}
function form(){const answered=S.sel.filter(v=>v!==undefined).length;
$("app").innerHTML=`<div class="card"><b>${esc(S.name)}</b> · ID ${esc(S.id)}<div class="score" style="text-align:start">${TITLE}: ${S.qs.length} questions, one choice each</div></div>`+
S.qs.map((q,i)=>`<div class="card"><div class="tag">Question ${i+1} of ${S.qs.length} · ${NAMES[q.t]}</div><div class="prob">${q.P.text}</div><p class="q" style="margin-top:12px">Choose the correct answer:</p>${q.opts.map((o,k)=>`<button class="opt ${S.sel[i]===k?"sel":""}" data-q="${i}" data-k="${k}">${o}</button>`).join("")}</div>`).join("")+
`<div class="score" id="cnt">${answered} of ${S.qs.length} answered</div><button class="btn" id="sub" ${answered<S.qs.length?"disabled":""}>Submit homework</button>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const y=window.scrollY;S.sel[+b.dataset.q]=+b.dataset.k;form();window.scrollTo(0,y)});
$("sub").onclick=()=>{if(confirm("Submit your answers? You can't change them after this."))submit()}}
function submit(){S.done=true;S.res=S.qs.map((q,i)=>q.opts[S.sel[i]]===q.ans);S.score=S.res.filter(Boolean).length;S.code=checksum(S.idn,S.sel);result()}
function result(){const n=S.qs.length,pc=Math.round(S.score/n*100);
$("app").innerHTML=`<div class="card final"><div class="big">${S.score} / ${n}</div><b>${pc}%</b><div class="score">${esc(S.name)} · ID ${esc(S.id)} · Code ${S.code}</div></div>
<div class="card"><p class="q">Results</p>${S.qs.map((q,i)=>`<div style="padding:4px 0">${S.res[i]?"✅":"❌"} Question ${i+1} · ${NAMES[q.t]}</div>`).join("")}</div>
<button class="btn" id="pdf">Download PDF</button><div class="score" id="pm">Upload the PDF to Moodle.</div><button class="tb" id="prt" style="width:100%;margin-top:8px">Print / save as PDF</button>`;
$("pdf").onclick=makePdf;$("prt").onclick=()=>{fillReport();window.print()};window.scrollTo(0,0)}
function fillReport(){const d=new Date().toLocaleDateString("en-GB");
$("report").innerHTML=`<div style="font-size:24px;font-weight:700;margin-bottom:6px">${TITLE}</div>
<div style="font-size:16px;line-height:1.7">Name: <b>${esc(S.name)}</b><br>University ID: <b>${esc(S.id)}</b><br>Date: ${d}<br>Score: <b>${S.score} / ${S.qs.length}</b> &nbsp; Code: ${S.code}</div><hr style="margin:12px 0;border:0;border-top:1px solid #ccc">`+
S.qs.map((q,i)=>`<div style="margin:0 0 14px;padding:10px;border:1px solid #ccc;border-radius:8px"><b>Q${i+1}. ${NAMES[q.t]}</b> ${S.res[i]?"✅":"❌"}<div style="margin:6px 0">${q.P.text}</div><div>Student answer: <b>${esc(q.opts[S.sel[i]])}</b></div></div>`).join("")}
async function makePdf(){fillReport();const pm=$("pm");pm.textContent="Preparing PDF...";
try{const canvas=await html2canvas($("report"),{scale:2,backgroundColor:"#ffffff"}),{jsPDF}=window.jspdf,pdf=new jsPDF({unit:"pt",format:"a4"}),W=pdf.internal.pageSize.getWidth(),H=pdf.internal.pageSize.getHeight(),img=canvas.toDataURL("image/jpeg",.92),ih=canvas.height*(W/canvas.width);
let y=0;while(y<ih-1){if(y>0)pdf.addPage();pdf.addImage(img,"JPEG",0,-y,W,ih);y+=H}
pdf.save(`homework-${S.idn.replace(/[^a-z0-9-]/g,"")}.pdf`);pm.textContent="PDF ready. Upload it to Moodle."}
catch(e){pm.textContent="Couldn't create the PDF here. Tap 'Print / save as PDF' instead."}}
function key(id){const idn=norm(id),qs=build(idn),sel=qs.map(q=>q.opts.indexOf(q.ans));
$("app").innerHTML=`<div class="card"><b>Teacher key</b> · ID ${esc(id)}<div class="score" style="text-align:start">Code for a perfect score: ${checksum(idn,sel)}</div></div>`+
qs.map((q,i)=>`<div class="card"><div class="tag">Question ${i+1} · ${NAMES[q.t]}</div><div class="prob">${q.P.text}</div><div class="reveal" style="margin-top:10px"><b>Answer: ${q.ans}</b>${q.P.steps.map(s=>`<div class="sol">${s.reveal}</div>`).join("")}</div></div>`).join("")+`<button class="btn" id="bk">Back</button>`;
$("bk").onclick=()=>home();window.scrollTo(0,0)}
home();
</script>
</body>
</html>
