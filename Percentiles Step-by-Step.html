<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Percentiles Step-by-Step</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2b2a;--mute:#66736f;--line:#dbe1dc;--acc:#0f6b5c;--accbg:#e1f1ed;--ok:#1b7f4b;--okbg:#e2f4ea;--bad:#b3341f;--badbg:#fbe9e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191a;--card:#1b2526;--ink:#e8efec;--mute:#93a29d;--line:#2d3b3c;--acc:#4fc3ad;--accbg:#173a35;--ok:#5fd394;--okbg:#17362a;--bad:#ff8a73;--badbg:#3b201b}}
:root[data-theme="dark"]{--bg:#12191a;--card:#1b2526;--ink:#e8efec;--mute:#93a29d;--line:#2d3b3c;--acc:#4fc3ad;--accbg:#173a35;--ok:#5fd394;--okbg:#17362a;--bad:#ff8a73;--badbg:#3b201b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;font-size:17px}
main{max-width:600px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.prob{font-size:17px;font-weight:600}
.scroll{overflow-x:auto;margin:8px 0 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;font-weight:400}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:center}
th{background:var(--accbg)}
.dots{display:flex;gap:6px;margin:0 0 12px}
.dot{height:6px;flex:1;border-radius:3px;background:var(--line)}
.dot.done{background:var(--ok)}.dot.cur{background:var(--acc)}
.q{font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:11px 14px;border-radius:10px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.hint{color:var(--bad);font-size:15px;margin:2px 0 8px}
.reveal{background:var(--accbg);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-size:16px}
.btn{border:0;background:var(--acc);color:#fff;padding:12px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.final{text-align:center}.final b{font-size:20px}
.score{color:var(--mute);font-size:14px;text-align:center;margin-top:8px}
.tutor{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}.tutor[hidden]{display:none}.trow{display:flex;gap:6px;flex-wrap:wrap}.trow input,.trow select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}.trow input{flex:1;min-width:150px}.tb{border:1.5px solid var(--acc);background:transparent;color:var(--acc);padding:8px 12px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer}.tb:disabled{opacity:.6}.tout{white-space:pre-wrap;margin-top:8px;font-size:16px;background:var(--accbg);border-radius:10px;padding:10px 12px}.tout:empty{display:none}.lvl{color:var(--mute);font-size:14px;margin:0 0 6px}</style>
</head>
<body>
<main>
<h1>Percentiles, Step by Step</h1>
<p class="sub">Method used: i = (P ÷ 100) × n. If i is whole, average the i-th and (i + 1)-th values; otherwise round i up. Percentile of a value = (values less than x ÷ n) × 100.</p>
<div class="lvl">Level</div><div class="chips" id="lv"></div><div class="lvl">Topic (suggested order 1 → 3)</div><div class="chips" id="chips"></div>
<div class="card"><div class="prob" id="prob"></div></div>
<div id="stage"></div>
<div class="score" id="score"></div>
</main>
<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sh=a=>[...a].sort(()=>Math.random()-.5);
const f=x=>String(+x.toFixed(3));
function numOpts(c,d=1){const s=new Set([f(c)]);let t=0;while(s.size<4&&t++<150){const v=c+R(1,4)*d*(Math.random()<.5?-1:1);if(c<=0||v>0)s.add(f(v))}return [...s]}
function o4(c,alts,n=4){const s=[c];alts.forEach(a=>{if(!s.includes(a)&&s.length<n)s.push(a)});return s}
let LV=1;
const pickLV=arr=>{const l=arr[LV-1];return l[R(0,l.length-1)]};
function mkData(n){const s=new Set();while(s.size<n)s.add(R(1,60));return [...s].sort((a,b)=>a-b)}
function pctl(x,P){const n=x.length,i=P*n/100;if((P*n)%100===0)return{i,whole:true,pos:i,val:(x[i-1]+x[i])/2};const c=Math.ceil(i);return{i,whole:false,pos:c,val:x[c-1]}}
function near(x,r){const q=r.pos,c=[],add=v=>{if(typeof v==="number"&&!isNaN(v))c.push(v)};
if(r.whole){add(x[q-1]);add(x[q]);add((x[q-2]+x[q-1])/2);add((x[q]+x[q+1])/2);add(x[q+1]);add(x[q-2])}
else{add(x[q-2]);add(x[q]);add((x[q-2]+x[q-1])/2);add(x[q+1]);add(x[q-3]);add((x[q]+x[q+1])/2)}
return c}
const ruleOpts=r=>r.whole?["i is a whole number: average the i-th and (i + 1)-th values","i is a whole number: take the i-th value only","i is a whole number: round up and take that value","i is a whole number: average the (i − 1)-th and i-th values"]:["i is not a whole number: round i UP and take that value","i is not a whole number: round i down and take that value","i is not a whole number: average the two nearest values","i is not a whole number: take the i-th value as is"];
function pr1(){const n=pickLV([[10],[12,15,20],[18,20,24,25,30]]),P=pickLV([[10,20,25,30,50,60,70,75,80,90],[20,25,40,50,60,75,90],[15,35,45,65,85,95]]),x=mkData(n),r=pctl(x,P),ds=sh(x).join(", ");
const how=r.whole?`${f(r.i)} is whole → average the ${r.pos}th and ${r.pos+1}th values: ${x[r.pos-1]} and ${x[r.pos]}`:`${f(r.i)} is not whole → round up to ${r.pos}; the ${r.pos}th value is ${x[r.pos-1]}`;
return{key:"pr1",chk:()=>{const i=P*n/100,v=Number.isInteger(+i.toFixed(9))?(x[i-1]+x[i])/2:x[Math.ceil(i)-1];return v===r.val},
text:`Find the ${P}th percentile of this data (n = ${n}): ${ds}`,steps:[
{q:"What must we do first?",opts:["Sort the data from smallest to largest","Find the mean","Find the range","Delete the largest value"],hint:"Positions only make sense on ordered data.",reveal:`Sorted: ${x.join(", ")}`},
{q:`n = ${n}. What is i = (P ÷ 100) × n for P = ${P}?`,opts:numOpts(r.i,.5),hint:`(${P} ÷ 100) × ${n}`,reveal:`i = (${P}/100) × ${n} = ${f(r.i)}`},
{q:`i = ${f(r.i)}. Which rule applies?`,opts:ruleOpts(r),hint:"Check whether i is a whole number.",reveal:how},
{q:`What is the ${P}th percentile?`,opts:o4(f(r.val),near(x,r).map(f)),hint:"Read the value(s) from the sorted list (i is a position, not a value).",reveal:`${P}th percentile = ${f(r.val)}`}]}}
function pr2(){const n=pickLV([[10,20],[25,12,15],[18,30,12,15]]),x=mkData(n),pos=R(2,n-1),xv=x[pos-1],less=pos-1,p=Math.round(less/n*100),ds=sh(x).join(", ");
return{key:"pr2",chk:()=>x.filter(v=>v<xv).length===less&&Math.round(100*less/n)===p,
text:`In this data set (n = ${n}), find the percentile of the value ${xv}. Round to the nearest whole number. Data: ${ds}`,steps:[
{q:"What must we do first?",opts:["Sort the data from smallest to largest","Find the mean","Find the range","Delete the largest value"],hint:"Counting is easiest on ordered data.",reveal:`Sorted: ${x.join(", ")}`},
{q:`How many values are less than ${xv}?`,opts:numOpts(less,1),hint:`Count only the values below ${xv}.`,reveal:`${less} values are less than ${xv}`},
{q:"Which formula gives the percentile of a value?",opts:["(number of values less than x ÷ n) × 100","(number of values greater than x ÷ n) × 100","(n ÷ number of values less than x) × 100","(position of x ÷ n) × 100"],hint:"Part below ÷ whole × 100.",reveal:"Percentile of x = (number of values less than x ÷ n) × 100"},
{q:`What is the percentile of ${xv}?`,opts:numOpts(p,2).map(v=>f(+v)),hint:`${less} ÷ ${n} × 100, then round.`,reveal:`${less} ÷ ${n} × 100 = ${f(100*less/n)} ≈ ${p}`}]}}
function pr3(){const n=pickLV([[10],[12,16,20],[15,20,16,24]]),x=mkData(n),a=pctl(x,25),b=pctl(x,75),iq=b.val-a.val,ds=sh(x).join(", ");
const q=(r,l,P)=>r.whole?`i = ${f(r.i)} is whole → average the ${r.pos}th and ${r.pos+1}th values: ${l} = ${f(r.val)}`:`i = ${f(r.i)} → round up to ${r.pos}: ${l} = ${f(r.val)}`;
return{key:"pr3",chk:()=>{const g=P=>{const i=P*n/100;return Math.abs(i-Math.round(i))<1e-9?(x[Math.round(i)-1]+x[Math.round(i)])/2:x[Math.ceil(i)-1]};return g(75)-g(25)===iq},
text:`Find Q1, Q3 and the IQR of this data (n = ${n}): ${ds}`,steps:[
{q:"What must we do first?",opts:["Sort the data from smallest to largest","Find the mean","Find the range","Delete the largest value"],hint:"Quartiles are percentiles, so we need positions.",reveal:`Sorted: ${x.join(", ")}`},
{q:`What is Q1 (the 25th percentile)? Here i = 0.25 × ${n} = ${f(a.i)}.`,opts:o4(f(a.val),near(x,a).map(f)),hint:"Whole i: average two values. Otherwise round up.",reveal:q(a,"Q1")},
{q:`What is Q3 (the 75th percentile)? Here i = 0.75 × ${n} = ${f(b.i)}.`,opts:o4(f(b.val),near(x,b).map(f)),hint:"Same rule as Q1.",reveal:q(b,"Q3")},
{q:"What is the IQR = Q3 − Q1?",opts:numOpts(iq,1),hint:`${f(b.val)} − ${f(a.val)}`,reveal:`IQR = ${f(b.val)} − ${f(a.val)} = ${f(iq)}`}]}}
const GEN={pr1,pr2,pr3};
const NAMES={pr1:"Find a percentile",pr2:"Percentile of a value",pr3:"Quartiles & IQR"};
const EX={
pr1:["الخطوة الأولى دائماً: نرتب البيانات من الأصغر للأكبر، لأن المواضع (الأول، الثاني، ...) تعتمد على الترتيب.","نحسب الموضع i = (P ÷ 100) × n حيث n عدد القيم. مثلاً P = 25 و n = 10 تعطي i = 2.5.","إذا كان i عدداً صحيحاً نأخذ متوسط القيمتين: i-th و (i+1)-th. وإذا لم يكن صحيحاً نقرّبه لأعلى ونأخذ القيمة عند هذا الموضع.","نقرأ القيمة من القائمة المرتبة (أو نحسب المتوسط). انتبهي: i هو موضع وليس قيمة."],
pr2:["نرتب البيانات تصاعدياً أولاً.","نعدّ كم قيمة أصغر من القيمة المطلوبة (الأصغر فقط، بدون القيمة نفسها).","قانون الرتبة المئوية: (عدد القيم الأصغر ÷ n) × 100.","نقسم ثم نضرب في 100، ونقرّب لأقرب عدد صحيح."],
pr3:["نرتب البيانات تصاعدياً أولاً.","Q1 هو الـ 25th percentile: نحسب i = 0.25 × n ثم نطبق القاعدة (متوسط القيمتين إذا i صحيح، وإذا لا نقرّب لأعلى).","Q3 هو الـ 75th percentile: نحسب i = 0.75 × n ونطبق نفس القاعدة.","المدى الربيعي IQR = Q3 − Q1."]};
let type="pr1",P,i,tries,right=0,total=0,locked;
const $=id=>document.getElementById(id);
function prep(p){p.steps.forEach(s=>{if(s.ans===undefined)s.ans=s.opts[0]});return p}
function renderChips(){$("chips").innerHTML=Object.keys(NAMES).map((k,ix)=>`<button class="chip" aria-pressed="${k===type}" data-k="${k}">${ix+1}. ${NAMES[k]}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{type=b.dataset.k;renderChips();start()})}
function start(){{let t=0,np;do{np=prep(GEN[type]())}while(P&&np.text===P.text&&t++<30);P=np}i=0;tries=0;$("prob").innerHTML=P.text;draw()}
function dots(){return `<div class="dots">${P.steps.map((_,k)=>`<div class="dot ${k<i?"done":k===i?"cur":""}"></div>`).join("")}</div>`}
function draw(){const st=$("stage");
if(i>=P.steps.length){st.innerHTML=`<div class="card final">${dots()}<b>Well done! Problem solved 🎉</b></div><button class="btn" id="nx">New problem</button>`;$("nx").onclick=start;score();return}
const s=P.steps[i];locked=false;
st.innerHTML=`<div class="card">${dots()}<p class="q">${s.q}</p>${sh(s.opts).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}<div class="hint" id="hint"></div><div class="trow" style="margin-top:6px"><button class="tb" id="exp">📖 اشرح هذه الخطوة</button></div><div class="tout" id="exout" dir="auto"></div><div class="tutor" id="tutor" hidden><div class="trow"><input id="tq" placeholder="Ask about this step (optional)" maxlength="200"><select id="tl" aria-label="Language"><option value="ar">عربي</option><option value="en">English</option></select><button class="tb" id="ask">💡 Ask the tutor</button></div><div class="tout" id="tout" dir="auto"></div></div></div>`;
st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOpt(b,s));wireTutor(s)}
function pickOpt(b,s){if(locked)return;
if(b.dataset.v===s.ans){locked=true;b.classList.add("good");total++;if(tries===0)right++;
b.closest(".card").insertAdjacentHTML("beforeend",`<div class="reveal">${s.reveal}</div><button class="btn" id="go">${i===P.steps.length-1?"Finish":"Next step"}</button>`);
$("go").onclick=()=>{i++;tries=0;draw()};score()}
else{tries++;b.classList.add("bad");b.disabled=true;$("hint").textContent="Not quite, try again. Hint: "+s.hint}}
function score(){$("score").textContent=total?`Correct on first try: ${right} of ${total}`:""}
function exText(){const k=P.key||type;const a=EX[k]||EX[type];return (a&&a[i])||"راجعي قانون هذه الخطوة في ملاحظاتك."}
const LVN=["Easy","Medium","Hard"];function renderLv(){$("lv").innerHTML=LVN.map((n,k)=>`<button class="chip" aria-pressed="${LV===k+1}" data-l="${k+1}">${n}</button>`).join("");$("lv").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{LV=+b.dataset.l;renderLv();start()})}
let SAMPLE=null;
function plain(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim()}
function wireTutor(s){const e=$("exp");if(e)e.onclick=()=>{$("exout").textContent=exText()};const box=$("tutor");if(!box)return;box.hidden=!SAMPLE;const btn=$("ask");
btn.onclick=async()=>{if(!SAMPLE)return;const q=$("tq").value.trim(),lang=$("tl").value,out=$("tout");btn.disabled=true;out.textContent="Thinking…";
const pr=`You are a friendly math tutor for a university student.\nProblem: ${plain(P.text)}\nCurrent step question: ${plain(s.q)}\nAnswer choices: ${s.opts.map(plain).join(" | ")}\nThe student ${locked?"has already answered this step correctly, so you may explain the full reasoning.":"has NOT answered yet. Do NOT state the correct choice or the final number. Give hints and explain the underlying concept so they can decide themselves."}\n${q?"Student's question: "+q:"Explain the idea behind this step simply."}\nReply in ${lang==="ar"?"simple Arabic (keep math notation and technical terms in English)":"simple English"}, under 120 words, plain text, no headings.`;
try{const r=await SAMPLE(pr,{cache:false,modelTier:"quick",onText:({text})=>{out.textContent=text}});out.textContent=r.text}
catch(e){out.textContent=e&&e.code==="rate_limited"?"Too many requests, please wait a moment.":"The tutor isn't available right now."}
finally{btn.disabled=false}}}
if(window.claude&&window.claude.use){window.claude.use("sample").then(x=>{SAMPLE=x;const b=document.getElementById("tutor");if(b)b.hidden=!SAMPLE}).catch(()=>{})}
renderLv();renderChips();start();
</script>
</body>
</html>
