{q:`The total of all values is ${S1} + ${S2} = ${S1+S2}, from ${n1+n2} values. What is the combined mean?`,opts:[f(c),f((m1+m2)/2),f(c+1),f(c-1)],ans:f(c),hint:`${S1+S2} \u00f7 ${n1+n2}`,reveal:`Combined mean = ${S1+S2} \u00f7 ${n1+n2} = ${f(c)}`}]}}}
GEN.mean=()=>{const vs=[()=>GEN.meanBase(),mSum,mCount,mMissing,mShift];if(LV>=2)vs.push(mAdd);return vary("mean"+LV,vs)};

GEN.percent=()=>{const cl=["0 – 10","10 – 20","20 – 30","30 – 40"];let fr;do{fr=Array.from({length:4},()=>R(2,LV===3?30:14))}while(LV!==3&&!(LV===1?[20,25]:[20,25,40,50]).includes(sum(fr)));
const k=R(0,3),F=sum(fr),p=fr[k]/F*100;
return{text:`What percentage of the data falls in the class ${cl[k]}?${gtable(cl,fr)}`,steps:[
{q:"Which formula gives the percentage of a class?",opts:["(class frequency ÷ total frequency) × 100","(total frequency ÷ class frequency) × 100","class frequency × total frequency"],hint:"Part ÷ whole, then × 100.",reveal:"Percentage = (f ÷ Σf) × 100"},
{q:"What is the total frequency Σf?",opts:numOpts(F,1),hint:"Add all the frequencies.",reveal:`Σf = ${fr.join(" + ")} = ${F}`},
{q:`The class ${cl[k]} has f = ${fr[k]}. What is its percentage?${LV===3?" (round to 1 decimal place)":""}`,opts:numOpts(p,5).map(v=>f(+v,1)),ans:f(p,1),hint:`${fr[k]} ÷ ${F} × 100`,reveal:`${fr[k]} ÷ ${F} × 100 = ${f(p,1)}%`}]}};

const MEAN_IDEAS=[()=>GEN.meanBase(),mSum,mCount,mMissing,mShift,mAdd];
const PLAN=[["mean",6],["median",2],["mode",2],["range",2],["variance",2],["sd",2]];
const TN={mean:"Mean",median:"Median",mode:"Mode",range:"Range",variance:"Variance",sd:"Standard deviation"};
const $=id=>document.getElementById(id);
function prep(p){const L=p.steps[p.steps.length-1];L.opts=[...new Set(L.opts)];if(L.ans===undefined)L.ans=L.opts[0];L.shuf=sh(L.opts);L.q="";L.reveal=p.steps.map(x=>x.reveal).join("<br>");p.steps=[L];return p}
let student="",PS=[];
$("go").onclick=()=>{const n=$("name").value.trim(),p=$("pass").value.trim();
 if(!n){$("err").textContent="Please enter your name";return}
 if(p!==ACCESS_CODE){$("err").textContent="Incorrect password";return}
 student=n;$("who").textContent=n;LV=HW_LEVEL;
 PS=PLAN.flatMap(([t,k])=>Array.from({length:k},(_,i)=>{const p=prep(t==="mean"?MEAN_IDEAS[i]():GEN[t]());p.tn=TN[t];return p}));
 $("login").classList.add("hide");$("hw").classList.remove("hide");render()};
function render(){let h="";
 PS.forEach((p,a)=>{h+=`<div class="card"><div class="mut">Problem ${a+1} · ${p.tn}</div><div class="prob">${p.text}</div>`;
  p.steps.forEach((s,b)=>{h+=`<div class="q">Choose the correct answer:</div>`;
   s.shuf.forEach((o,c)=>{h+=`<label class="opt"><input type="radio" name="p${a}s${b}" value="${c}">${o}</label>`})});
  h+="</div>"});
 $("qs").innerHTML=h}
$("submit").onclick=()=>{let miss=0;
 PS.forEach((p,a)=>p.steps.forEach((s,b)=>{const c=document.querySelector(`input[name="p${a}s${b}"]:checked`);s.pick=c?+c.value:null;if(!c)miss++}));
 if(miss){$("err2").textContent=miss+" problem(s) not answered";return}
 let sc=0,tot=0,h="";
 PS.forEach((p,a)=>{h+=`<div class="card"><div class="mut">Problem ${a+1} · ${p.tn}</div><div class="prob">${p.text}</div>`;
  p.steps.forEach((s,b)=>{const ok=s.shuf[s.pick]===s.ans;tot++;if(ok)sc++;
   h+=`<div class="q">Choose the correct answer:</div>`;
   s.shuf.forEach((o,c)=>{const cls=o===s.ans?"good":(c===s.pick?"bad":"");h+=`<label class="opt ${cls}">${c===s.pick?"● ":"○ "}${o}${o===s.ans?" ✔":""}</label>`});
   h+=`<div class="reveal"><b>Solution:</b><br>${s.reveal}</div>`});
  h+="</div>"});
 $("rdet").innerHTML=h;$("score").textContent=sc+" / "+tot;$("rwho").textContent=student;
 $("rdate").textContent=new Date().toLocaleString("en");
 $("hw").classList.add("hide");$("res").classList.remove("hide");window.scrollTo(0,0)};
const LIGHT={"--bg":"#f6f7f4","--card":"#fff","--ink":"#1d2b2a","--mute":"#66736f","--line":"#dbe1dc","--acc":"#0f6b5c","--accbg":"#e1f1ed","--ok":"#1b7f4b","--okbg":"#e2f4ea","--bad":"#b3341f","--badbg":"#fbe9e5"};
$("pdf").onclick=async()=>{
 const btn=$("pdf"),msg=$("pmsg"),fname="Homework-"+student.replace(/\s+/g,"_")+".pdf";
 btn.disabled=true;btn.textContent="Preparing PDF…";
 try{
  const dl=await (window.claude&&claude.use?claude.use("downloads"):null);
  if(!dl||!window.jspdf||!window.html2canvas){document.title=fname;window.print();return}
  const els=[document.querySelector("#res > .card"),...document.querySelectorAll("#rdet > .card")];
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
  const M=15,W=210-2*M,H=297-2*M;let y=M;
  for(const el of els){
   const cv=await html2canvas(el,{scale:2,windowWidth:800,backgroundColor:"#ffffff",onclone:d=>{
     const r=d.documentElement;for(const k in LIGHT)r.style.setProperty(k,LIGHT[k]);
     r.setAttribute("data-theme","light");d.body.style.background="#fff";d.body.style.color="#1d2b2a"}});
   const h=cv.height*W/cv.width;
   if(y+h>297-M&&y>M){pdf.addPage();y=M}
   pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",M,y,W,Math.min(h,H));
   y+=h+4;
  }
  const blob=pdf.output("blob");
  await dl.save({filename:fname,data:blob});
  msg.textContent="Done ✅ You can tap the button again if you need to re-send it.";
 }catch(e){
  msg.textContent=(e&&e.code==="declined")?"Cancelled. Tap the button to try again.":"Could not create the PDF. Try again, or open the link in your browser.";
 }finally{btn.disabled=false;btn.textContent="Save PDF / Send to teacher"}
};
</script></body></html>
