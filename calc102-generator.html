<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

/* ---------- 1. power rule ---------- */

return{key:"g2a",chk:dchk(T.G,T.g),text:`Evaluate ∫ ${T.ex} dx`,steps:[recall(kind),{q:"What is the integral?",opts:o4(T.F+" + C",kind==="e"?[`${k}·eˣ / ln ${k} + C`,`eˣ + C`,`${k}·eˣ⁺¹ + C`]:[`${k}·${a}ˣ ln ${a} + C`,`${k}·${a}ˣ + C`,`${a}ˣ / ln ${a} + C`]),hint:"Keep the constant factor outside.",reveal:T.F+" + C"}]}}

return{key:"g2b",chk:dchk(G,g),text:`Evaluate ∫ (${txt}) dx`,steps:[recall(kinds[0]),{q:`What is the integral of the first term, ${e1}?`,opts:o4(f1,[kinds[0]==="e"?`${ks[0]}·eˣ / ln ${ks[0]}`:`${f1.replace(" / ln "+a1," ln "+a1)}`,f1.replace(/ \/ ln \d/,""),`${f1}²`]),hint:"Apply the formula to the term and keep the constant.",reveal:f1},{q:`And the second term, ${e2}?`,opts:o4(f2,[f2.replace(/ \/ ln (\d)/," ln $1"),f2.replace(/ \/ ln \d/,""),f2.replace(a2+"ˣ",a1+"ˣ")]),hint:"Same idea, with its own base.",reveal:f2},{q:"What is the full integral?",opts:o4(fin,[`${f1} ${op==="+"?"−":"+"} ${f2} + C`,`${f1.replace(/ \/ ln \d/,"")} ${op} ${f2} + C`,`${f2} ${op} ${f1} + C`]),hint:"Integrate term by term, keep the sign, add + C.",reveal:fin}]}}
/* ---------- 3. basic trig list ---------- */
const BT=[["sin x","−cos x",x=>Math.sin(x),x=>-Math.cos(x)],["cos x","sin x",x=>Math.cos(x),x=>Math.sin(x)],["sec²x","tan x",x=>1/Math.cos(x)**2,x=>Math.tan(x)],["csc²x","−cot x",x=>1/Math.sin(x)**2,x=>-Math.cos(x)/Math.sin(x)],["sec x tan x","sec x",x=>Math.tan(x)/Math.cos(x),x=>1/Math.cos(x)],["csc x cot x","−csc x",x=>Math.cos(x)/Math.sin(x)**2,x=>-1/Math.sin(x)],["1/(1 + x²)","tan⁻¹ x",x=>1/(1+x*x),x=>Math.atan(x)]];
function g3(){const S=sh(BT),A=S[0],B=S[1],oth=S.slice(2).map(t=>t[1]),k=LV===1?R(2,9):R(2,6),m=R(2,9),sgn=LV===3&&Math.random()<.5?-1:1,w=(c,t)=>c===1?`${t}`:`${c}·(${t})`;
const kt=(c,t)=>`${c} ${t[0]==="1"?`${t}`:t}`;
if(LV===1){return{key:"g3",chk:dchk(x=>k*A[3](x),x=>k*A[2](x)),text:`Evaluate ∫ ${A[0]==="1/(1 + x²)"?`${k}/(1 + x²)`:`${k} ${A[0]}`} dx`,steps:[

{q:`What is ∫ ${A[0]} dx (without the constant of integration)?`,opts:o4(A[1],oth),hint:"Recall the standard integrals.",reveal:`∫ ${A[0]} dx = ${A[1]}`},
{q:"What is the final answer?",opts:o4(`${k}·(${A[1]}) + C`,[`(${A[1]}) + C`,`${k}·(${A[1]})`,`${k}·(${oth[0]}) + C`]),hint:"Multiply by k and add C.",reveal:`${k}·(${A[1]}) + C`}]}}

return{key:"g3b",chk:dchk(x=>k*A[3](x)+sgn*m*B[3](x),x=>k*A[2](x)+sgn*m*B[2](x)),text:`Evaluate ∫ (${k} ${A[0]} ${op} ${m} ${B[0]}) dx`.replace(/(\d) 1\/\(1 \+ x²\)/g,"$1/(1 + x²)"),steps:[
{q:"How do we start?",opts:["Integrate term by term, taking constants outside","Multiply the two functions","Differentiate each term","Integrate only the first term"],hint:"∫ (f ± g) dx = ∫ f dx ± ∫ g dx",reveal:`= ${k}∫ ${A[0]} dx ${op} ${m}∫ ${B[0]} dx`},
{q:`What is ∫ ${A[0]} dx?`,opts:o4(A[1],[B[1],...oth]),hint:"Standard integrals.",reveal:`∫ ${A[0]} dx = ${A[1]}`},
{q:`What is ∫ ${B[0]} dx?`,opts:o4(B[1],[A[1],...oth]),hint:"Standard integrals.",reveal:`∫ ${B[0]} dx = ${B[1]}`},
{q:"What is the final answer?",opts:o4(fin,[`${k}·(${B[1]}) ${op} ${m}·(${A[1]}) + C`,`${k}·(${A[1]}) ${op==="+"?"−":"+"} ${m}·(${B[1]}) + C`,`${k}·(${A[1]}) ${op} ${m}·(${B[1]})`]),hint:"Keep the constants and the sign, add one C.",reveal:fin}]}}
/* ---------- 4. linear argument (ax + b) ---------- */
function g4(){const form=pick(LV===1?["pow"]:LV===2?["inv","exp","sin","cos","sec2"]:["pow","inv","exp","aexp"]);
let a=LV===3?pick([-1,-2,-3,2,3]):R(2,4),b=nz(-5,5);if(LV===3&&(form==="pow")&&a>0)a=-a;

/* ---------- 5. g'/g rule ---------- */

g5:[["g(x) is the function whose derivative appears in the numerator (often the denominator).","g(x) هي الدالة التي مشتقتها موجودة بالبسط (غالباً المقام)."],["Differentiate g to get g′.","نشتق g لنجد g′."],["Compare the numerator with g′: it may equal it, or be a constant multiple of it.","نقارن البسط مع g′: يساويها أو يساوي مضاعفاً ثابتاً لها."],["∫ g′/g dx = ln|g| + C. A constant multiple stays in front.","التكامل = ln|g|، والثابت يبقى بالأمام."]],
g5r:[["tan x = sin x / cos x and cot x = cos x / sin x.","tan x = sin x / cos x و cot x = cos x / sin x."],["g is the denominator.","g هي المقام."],["Differentiate g. For g = cos x we get g′ = −sin x.","نشتق g. وإذا كانت g = cos x فمشتقتها −sin x."],["tan x gives −ln|cos x|, and cot x gives ln|sin x|.","tan x تعطي −ln|cos x| و cot x تعطي ln|sin x|."]],
g6:[["Multiply and divide by (sec x + tan x) for sec, or (csc x − cot x) for csc.","نضرب ونقسم على (sec x + tan x) مع sec، أو على (csc x − cot x) مع csc."],["The numerator becomes the derivative of the denominator, so we can use g′/g.","البسط يصير مشتقة المقام، فنستخدم g′/g."],["∫ g′/g dx = ln|g| + C.","التكامل = ln|g| + C."]],
g6b:[["The basic result: ∫ sec u du = ln|sec u + tan u| + C and ∫ csc u du = ln|csc u − cot u| + C.","النتيجة الأساسية لـ sec و csc."],["When the inside is ax, divide by a. The constant k stays in front: factor = k/a.","لما يكون الداخل ax نقسم على a، والثابت k يبقى: المعامل = k/a."],["Put the coefficient in front of the ln and add + C.","نضع المعامل أمام ln ونضيف + C."]],
g7:[["Use the power-reduction identity to remove the square.","نستخدم متطابقة تخفيض القوة لإزالة التربيع."],["∫ cos(ax) dx = sin(ax)/a, so ∫ cos 2x dx = sin 2x / 2.","∫ cos(ax) dx = sin(ax)/a."],["Substitute and integrate. For sin²x: x/2 − sin 2x/4. For cos²x: x/2 + sin 2x/4.","نعوّض ونكامل: sin²x تعطي x/2 − sin 2x/4 و cos²x تعطي x/2 + sin 2x/4."]],
g7s:[["One factor is the derivative of the other: ∫ g·g′ dx = g²/2.","أحد العاملين مشتقة الآخر: ∫ g·g′ dx = g²/2."],["g = sin x, g′ = cos x.","g = sin x و g′ = cos x."],["Result: sin²x/2 + C, times the constant k.","النتيجة sin²x/2 + C مضروبة بالثابت."]],
g7t:[["Use a trig identity to simplify the integrand first.","نبسّط الدالة أولاً بمتطابقة مثلثية."],["Then integrate the simpler expression.","ثم نكامل التعبير الأبسط."]],
g8:[["Match the denominator with the standard forms: x − a, (x − a)², x² + a², x² − a².","نطابق المقام مع الصيغ القياسية."],["Find a. For x² + a² the number is a² (so take the square root).","نجد a. وفي x² + a² الرقم هو a² فنأخذ جذره."],["Substitute a into the formula: tan⁻¹ forms have 1/a in front, and (Ax + B)/(x² + a²) gives (A/2) ln(x² + a²) + (B/a) tan⁻¹(x/a).","نعوّض a بالقانون."]],
g9a:[["For ax² + bx + c with 4ac − b² > 0 we use the tan⁻¹ formula.","إذا كان 4ac − b² > 0 نستخدم قانون tan⁻¹."],["Take the square root of 4ac − b².","نأخذ الجذر التربيعي لـ 4ac − b²."],["∫ dx/(ax²+bx+c) = (2/√(4ac−b²)) tan⁻¹((2ax+b)/√(4ac−b²)) + C. The factor in front is 2/√(...), not 1/√(...).","المعامل بالأمام هو 2/√(4ac − b²)، مش 1/√."]],
g9b:[["Look at the expression under the root: a² − x² gives sin⁻¹, while x² ± a² give ln.","ننظر لما تحت الجذر: a² − x² تعطي sin⁻¹ و x² ± a² تعطي ln."],["a² is the number under the root, so a is its square root.","a² هو الرقم تحت الجذر فنأخذ جذره."],["Substitute a into the formula.","نعوّض a بالقانون."]]};
let type="g1",P,i,tries,right=0,total=0,locked;
const $=id=>document.getElementById(id);
function prep(p){p.steps.forEach(s=>{if(s.ans===undefined)s.ans=s.opts[0]});return p}
function renderChips(){$("chips").innerHTML=Object.keys(NAMES).map((k,ix)=>`<button class="chip" aria-pressed="${k===type}" data-k="${k}">${ix+1}. ${NAMES[k]}</button>`).join("");
$("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{type=b.dataset.k;renderChips();start()})}
function start(){{let t=0,np;do{np=prep(GEN[type]())}while(P&&np.text===P.text&&t++<30);P=np}i=0;tries=0;$("prob").innerHTML=P.text;draw()}
function dots(){return `<div class="dots">${P.steps.map((_,k)=>`<div class="dot ${k<i?"done":k===i?"cur":""}"></div>`).join("")}</div>`}
function draw(){const st=$("stage");
if(i>=P.steps.length){st.innerHTML=`<div class="card final">${dots()}<b>Well done! Problem solved 🎉</b></div><button class="btn" id="nx">New problem</button>`;$("nx").onclick=start;score();return}
const s=P.steps[i];locked=false;
st.innerHTML=`<div class="card">${dots()}<p class="q">${s.q}</p>${sh(s.opts).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join("")}<div class="hint" id="hint"></div><div class="trow" style="margin-top:6px"><button class="tb" id="exp">📖 Explain this step</button></div><div class="tout" id="exout" dir="auto"></div><div class="tutor" id="tutor" hidden><div class="trow"><input id="tq" placeholder="Ask about this step (optional)" maxlength="200"><select id="tl" aria-label="Language"><option value="ar">عربي</option><option value="en">English</option></select><button class="tb" id="ask">💡 Ask the tutor</button></div><div class="tout" id="tout" dir="auto"></div></div></div>`;
st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOpt(b,s));wireTutor(s)}
function pickOpt(b,s){if(locked)return;
if(b.dataset.v===s.ans){locked=true;b.classList.add("good");total++;if(tries===0)right++;
b.closest(".card").insertAdjacentHTML("beforeend",`<div class="reveal">${s.reveal}</div><button class="btn" id="go">${i===P.steps.length-1?"Finish":"Next step"}</button>`);
$("go").onclick=()=>{i++;tries=0;draw()};score()}
else{tries++;b.classList.add("bad");b.disabled=true;$("hint").textContent="Not quite, try again. Hint: "+s.hint}}
function score(){$("score").textContent=total?`Correct on first try: ${right} of ${total}`:""}
function exText(){const k=P.key||type,a=EX[k]||EX[type],v=a&&a[i];return v?v[0]+"

"+v[1]:"Review the rule for this step in your notes."}
const LVN=["Easy","Medium","Hard"];function renderLv(){$("lv").innerHTML=LVN.map((n,k)=>`<button class="chip" aria-pressed="${LV===k+1}" data-l="${k+1}">${n}</button>`).join("");$("lv").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{LV=+b.dataset.l;renderLv();start()})}
let SAMPLE=null;
function plain(h){const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim()}
function wireTutor(s){const e=$("exp");if(e)e.onclick=()=>{$("exout").textContent=exText()};const box=$("tutor");if(!box)return;box.hidden=!SAMPLE;const btn=$("ask");
btn.onclick=async()=>{if(!SAMPLE)return;const q=$("tq").value.trim(),lang=$("tl").value,out=$("tout");btn.disabled=true;out.textContent="Thinking…";
const pr=`You are a friendly math tutor for a university student.\nProblem: ${plain(P.text)}\nCurrent step question: ${plain(s.q)}\nAnswer choices: ${s.opts.map(plain).join(" | ")}\nThe student ${locked?"has already answered this step correctly, so you may explain the full reasoning.":"has NOT answered yet. Do NOT state the correct choice or the final number. Give hints and explain the underlying concept so they can decide themselves."}\n${q?"Student's question: "+q:"Explain the idea behind this step simply."}\nReply in ${lang==="ar"?"simple Arabic (keep math notation and technical terms in English)":"simple English"}, under 120 words, plain text, no headings.`;
try{const r=await SAMPLE(pr,{cache:false,modelTier:"quick",onText:({text})=>{out.textContent=text}});out.textContent=r.text}
catch(e){out.textContent=e&&e.code==="rate_limited"?"Too many requests, please wait a moment.":"The tutor isn't available right now."}
finally{btn.disabled=false}}}
if(window.claude&&window.claude.use){window.claude.use("sample").then(x=>{SAMPLE=x;const b=document.getElementById("tutor");if(b)b.hidden=!SAMPLE}).catch(()=>{})}
renderLv();renderChips();start();
</script>
</body>
