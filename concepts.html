<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9 مفاهيم إحصائية — بطاقات الورشة التفاعلية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card-back: #18233c;
      --border: #263554;
      --text: #f8fafc;
      --muted: #94a3b8;
      --amber: #f59e0b;
      --teal: #14b8a6;
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      background: radial-gradient(circle at top, #172554 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
      line-height: 1.65;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
      background: rgba(19, 28, 49, 0.85);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 16px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button, a.nav-btn {
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      cursor: pointer;
      text-decoration: none;
      transition: 0.15s;
    }

    button:hover, a.nav-btn:hover {
      border-color: var(--blue);
      background: #172554;
    }

    button.primary {
      background: var(--teal);
      color: #042f2e;
      border-color: var(--teal);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 18px;
    }

    .concept-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 290px;
      position: relative;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
    }

    .concept-card:hover {
      transform: translateY(-3px);
      border-color: var(--blue);
    }

    .concept-card.flipped {
      background: var(--card-back);
      border-color: var(--teal);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .num-badge {
      background: rgba(59, 130, 246, 0.18);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #93c5fd;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 2px 10px;
      border-radius: 999px;
    }

    .flip-hint {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .visual-box {
      background: #090e1a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 128px;
    }

    .visual-box svg {
      width: 100%;
      height: 104px;
    }

    .concept-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .concept-en {
      font-size: 0.82rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .back-content {
      display: none;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .concept-card.flipped .front-content {
      display: none;
    }

    .concept-card.flipped .back-content {
      display: flex;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: #5eead4;
      margin-bottom: 2px;
    }

    .desc-text {
      font-size: 0.9rem;
      color: #e2e8f0;
    }

    .survey-link-box {
      background: rgba(20, 184, 166, 0.12);
      border-right: 3px solid var(--teal);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.86rem;
      color: #ccfbf1;
    }

    @media print {
      body {
        background: #fff;
        color: #0f172a;
        padding: 10px;
      }
      .header {
        background: #f8fafc;
        border-color: #cbd5e1;
      }
      .header h1 {
        color: #0f172a;
      }
      .controls, .flip-hint {
        display: none;
      }
      .concept-card {
        background: #fff !important;
        border: 1px solid #94a3b8;
        box-shadow: none;
        break-inside: avoid;
        min-height: auto;
      }
      .front-content, .back-content {
        display: flex !important;
        flex-direction: column;
      }
      .concept-title, .desc-text {
        color: #0f172a;
      }
      .survey-link-box {
        background: #f0fdfa;
        color: #115e59;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>📊 9 مفاهيم إحصائية أساسية لقراءة نتائج الاستبانة</h1>
      <p>اضغطي على أي بطاقة لقلبها وعرض ارتباطها المباشر بنتائج الاستبانة وتطبيق المنحنى</p>
    </div>
    <div class="controls">
      <button type="button" class="primary" id="flipAllBtn">قلب جميع البطاقات</button>
      <button type="button" onclick="window.print()">طباعة / حفظ PDF</button>
      <a href="quest.html" class="nav-btn">الانتقال إلى اللعبة ←</a>
    </div>
  </div>

  <div class="grid" id="cardsGrid"></div>
</div>

<script>
  const CONCEPTS = [
    {
      id: 1,
      ar: "التوزيع الطبيعي",
      en: "Normal Distribution",
      idea: "منحنى الجرس المتماثل حيث تتمركز أغلب الاستجابات حول المنتصف وتقل تدريجياً نحو الطرفين.",
      survey: "يوضح كيف تتوزع درجات الطلاب حول المتوسط في محاور الاستبانة (مثل توفير الوقت والتحصيل) داخل quest.html.",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="15" y1="86" x2="205" y2="86" stroke="#475569" stroke-width="2"/>
        <path d="M 20 85 C 65 85, 80 18, 110 18 C 140 18, 155 85, 200 85" fill="rgba(59,130,246,0.22)" stroke="#3b82f6" stroke-width="3"/>
        <line x1="110" y1="18" x2="110" y2="86" stroke="#38bdf8" stroke-dasharray="4 3" stroke-width="2"/>
      </svg>`
    },
    {
      id: 2,
      ar: "القاعدة التجريبية (68–95–99.7)",
      en: "Empirical Rule (±1, ±2, ±3 SD)",
      idea: "تحديد النسبة المئوية للبيانات الواقعة ضمن انحراف معياري واحد أو اثنين أو ثلاثة حول المتوسط.",
      survey: "يكشف النطاق الذي يضم 68% أو 95% من آراء الطلاب، وهو محور التحدي التفاعلي في الورشة.",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="15" y1="86" x2="205" y2="86" stroke="#475569" stroke-width="2"/>
        <path d="M 82 85 L 82 40 C 92 24, 100 18, 110 18 C 120 18, 128 24, 138 40 L 138 85 Z" fill="rgba(20,184,166,0.45)"/>
        <path d="M 20 85 C 65 85, 80 18, 110 18 C 140 18, 155 85, 200 85" fill="none" stroke="#14b8a6" stroke-width="3"/>
      </svg>`
    },
    {
      id: 3,
      ar: "النزعة المركزية",
      en: "Central Tendency (Mean & Median)",
      idea: "نقطة الارتكاز التي تلخص موقع تجمع البيانات في قيمة تمثيلية واحدة.",
      survey: "تلخيص استجابات المحور في رقم واحد (مثل 4.05 لتوفير الوقت) قبل فحص تفاصيل التشتت.",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="25" y1="52" x2="195" y2="52" stroke="#475569" stroke-width="2"/>
        <circle cx="55" cy="52" r="5" fill="#3b82f6"/>
        <circle cx="82" cy="52" r="5" fill="#3b82f6"/>
        <circle cx="110" cy="52" r="11" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="110" cy="52" r="5" fill="#f59e0b"/>
        <circle cx="138" cy="52" r="5" fill="#3b82f6"/>
        <circle cx="168" cy="52" r="5" fill="#ef4444"/>
      </svg>`
    },
    {
      id: 4,
      ar: "التشتت والانحراف المعياري",
      en: "Spread & Standard Deviation",
      idea: "قياس مدى تقارب القيم من المتوسط أو تباعدها عنه يميناً ويساراً.",
      survey: "يبيّن هل آراء الطلاب متقاربة ومجمعة (SD صغير) أم متباينة بين مؤيد ومعارض (SD كبير).",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="110" y1="12" x2="110" y2="90" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="2"/>
        <line x1="65" y1="28" x2="155" y2="28" stroke="#3b82f6" stroke-width="4"/>
        <circle cx="65" cy="28" r="4" fill="#38bdf8"/><circle cx="155" cy="28" r="4" fill="#38bdf8"/>
        <line x1="35" y1="52" x2="185" y2="52" stroke="#f59e0b" stroke-width="4"/>
        <circle cx="35" cy="52" r="4" fill="#fbbf24"/><circle cx="185" cy="52" r="4" fill="#fbbf24"/>
        <line x1="80" y1="76" x2="140" y2="76" stroke="#22c55e" stroke-width="4"/>
        <circle cx="80" cy="76" r="4" fill="#4ade80"/><circle cx="140" cy="76" r="4" fill="#4ade80"/>
      </svg>`
    },
    {
      id: 5,
      ar: "المدرج التكراري",
      en: "Histogram",
      idea: "أعمدة متلاصقة تُظهر عدد التكرارات في كل فئة أو درجة من درجات المقياس.",
      survey: "يعرض عدد الطلاب الذين اختاروا «موافق بشدة» مقابل «محايد» أو «غير موافق» في كل سؤال.",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="25" y1="86" x2="195" y2="86" stroke="#475569" stroke-width="2"/>
        <rect x="35" y="64" width="22" height="22" fill="#3b82f6" rx="2"/>
        <rect x="61" y="46" width="22" height="40" fill="#3b82f6" rx="2"/>
        <rect x="87" y="22" width="22" height="64" fill="#38bdf8" rx="2"/>
        <rect x="113" y="34" width="22" height="52" fill="#3b82f6" rx="2"/>
        <rect x="139" y="54" width="22" height="32" fill="#3b82f6" rx="2"/>
        <rect x="165" y="72" width="22" height="14" fill="#3b82f6" rx="2"/>
      </svg>`
    },
    {
      id: 6,
      ar: "مقارنة المجموعات",
      en: "Group Comparison",
      idea: "مقارنة متوسطات وتشتت فئتين أو أكثر لاكتشاف الفروق بينها بصرياً.",
      survey: "مقارنة استجابات الكليات العلمية والإنسانية والاقتصادية جنباً إلى جنب على المنحنى المزدوج.",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="15" y1="86" x2="205" y2="86" stroke="#475569" stroke-width="2"/>
        <path d="M 20 85 C 55 85, 70 22, 95 22 C 120 22, 135 85, 170 85" fill="none" stroke="#3b82f6" stroke-width="3"/>
        <path d="M 55 85 C 85 85, 105 34, 132 34 C 160 34, 175 85, 202 85" fill="none" stroke="#f472b6" stroke-dasharray="5 3" stroke-width="3"/>
      </svg>`
    },
    {
      id: 7,
      ar: "العينة والمجتمع",
      en: "Sample & Population",
      idea: "اختيار مجموعة ممثلة من المجتمع الكلي لدراستها واستخلاص مؤشرات عامة منها.",
      survey: "يوضح أن الردود المجمعة في ملف CSV تمثل عينة من الطلبة نستدل بها على الاتجاه العام.",
      svg: `<svg viewBox="0 0 220 100">
        <rect x="42" y="16" width="136" height="68" rx="10" fill="none" stroke="#475569" stroke-width="2"/>
        <circle cx="64" cy="34" r="4" fill="#3b82f6"/><circle cx="88" cy="34" r="4" fill="#3b82f6"/>
        <circle cx="112" cy="34" r="4" fill="#f59e0b"/><circle cx="136" cy="34" r="4" fill="#3b82f6"/><circle cx="158" cy="34" r="4" fill="#3b82f6"/>
        <circle cx="64" cy="50" r="4" fill="#3b82f6"/><circle cx="88" cy="50" r="5" fill="#ef4444"/>
        <circle cx="112" cy="50" r="4" fill="#3b82f6"/><circle cx="136" cy="50" r="4" fill="#f59e0b"/><circle cx="158" cy="50" r="4" fill="#3b82f6"/>
        <circle cx="64" cy="66" r="4" fill="#3b82f6"/><circle cx="88" cy="66" r="4" fill="#3b82f6"/>
        <circle cx="112" cy="66" r="4" fill="#3b82f6"/><circle cx="136" cy="66" r="4" fill="#3b82f6"/><circle cx="158" cy="66" r="4" fill="#f59e0b"/>
      </svg>`
    },
    {
      id: 8,
      ar: "القيم المتطرفة",
      en: "Outliers",
      idea: "ملاحظات بعيدة بشكل واضح عن التجمع الرئيسي لبقية البيانات.",
      survey: "رصد الحالات الاستثنائية (مثلاً طالب أعطى تقييماً منخفضاً جداً مقارنة بزملائه) وفهم سببها.",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="20" y1="86" x2="200" y2="86" stroke="#475569" stroke-width="2"/>
        <rect x="35" y="42" width="18" height="44" fill="#3b82f6" rx="2"/>
        <rect x="58" y="24" width="18" height="62" fill="#3b82f6" rx="2"/>
        <rect x="81" y="34" width="18" height="52" fill="#3b82f6" rx="2"/>
        <rect x="104" y="56" width="18" height="30" fill="#3b82f6" rx="2"/>
        <rect x="168" y="74" width="16" height="12" fill="#f59e0b" rx="2"/>
        <circle cx="176" cy="80" r="14" fill="none" stroke="#f59e0b" stroke-width="2"/>
      </svg>`
    },
    {
      id: 9,
      ar: "الارتباط والانحدار",
      en: "Correlation & Regression",
      idea: "قياس قوة واتجاه العلاقة بين متغيرين ورسم خط الاتجاه العام بينهما.",
      survey: "اختبار العلاقة بين «الاعتماد المباشر دون تحقق (س23)» وبين «مستوى الفهم والتحصيل (س20–22)».",
      svg: `<svg viewBox="0 0 220 100">
        <line x1="32" y1="84" x2="192" y2="84" stroke="#475569" stroke-width="2"/>
        <line x1="32" y1="16" x2="32" y2="84" stroke="#475569" stroke-width="2"/>
        <line x1="42" y1="76" x2="178" y2="24" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="52" cy="70" r="4" fill="#38bdf8"/><circle cx="72" cy="66" r="4" fill="#38bdf8"/>
        <circle cx="88" cy="54" r="4" fill="#38bdf8"/><circle cx="110" cy="52" r="4" fill="#38bdf8"/>
        <circle cx="128" cy="38" r="4" fill="#38bdf8"/><circle cx="148" cy="36" r="4" fill="#38bdf8"/>
        <circle cx="168" cy="24" r="4" fill="#38bdf8"/>
      </svg>`
    }
  ];

  const grid = document.getElementById("cardsGrid");
  CONCEPTS.forEach(c => {
    const card = document.createElement("div");
    card.className = "concept-card";
    card.innerHTML = `
      <div class="card-top">
        <span class="num-badge">مفهوم ${c.id}</span>
        <span class="flip-hint">اضغطي للقلب ↺</span>
      </div>
      <div class="front-content">
        <div class="visual-box">${c.svg}</div>
        <div class="concept-title">${c.ar}</div>
        <div class="concept-en">${c.en}</div>
      </div>
      <div class="back-content">
        <div>
          <div class="section-label">الفكرة الإحصائية:</div>
          <div class="desc-text">${c.idea}</div>
        </div>
        <div class="survey-link-box">
          <div class="section-label" style="color:#5eead4;">ربطه بالاستبانة في الورشة:</div>
          <div>${c.survey}</div>
        </div>
      </div>
    `;
    card.addEventListener("click", () => card.classList.toggle("flipped"));
    grid.appendChild(card);
  });

  let allFlipped = false;
  document.getElementById("flipAllBtn").addEventListener("click", () => {
    allFlipped = !allFlipped;
    document.querySelectorAll(".concept-card").forEach(card => {
      card.classList.toggle("flipped", allFlipped);
    });
    document.getElementById("flipAllBtn").textContent = allFlipped ? "إعادة الوجه الأمامي" : "قلب جميع البطاقات";
  });
</script>
</body>
</html>
